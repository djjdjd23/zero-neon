  R(x+sway,y-40,1,10,'#41506a');
  R(x-2+sway,y-31,5,2,'#5b6a86');
  var sp=(G.tick*8)%3;
  if(sp<1){
    A(x-4,y-16,1,1,'#fff2b0',0.9);
    A(x-5,y-15,1,1,'#ffc857',0.7);
    A(x-3,y-14,1,1,'#ff8f5a',0.6);
    glow(x-4,y-15,8,'#ffc857',0.16);
  }
  var p=1-st.buildT/(isShop(st.kind)?25:10);
  R(x-15,y-34,30,4,'#080c14');
  R(x-14,y-33,28,2,'#18202f');
  R(x-14,y-33,28*clamp(p,0,1),2,'#8fd3ff');
  A(x-14,y-33,28*clamp(p,0,1),1,'#d6f4ff',0.6);
}

function drawStructure(st){
  if(st.state==='ruin'){ drawRuin(st); return; }
  if(st.state==='building'){ drawSite(st); return; }
  if(isShop(st.kind)) drawShop(st);
  else drawDef(st);
}

// ============================== 人形渲染 ==============================
// 轮廓 → 腿 → 躯干（上宽下窄）→ 手臂（外挂）→ 头（脸+发/帽+护目镜）
function OB(x,y,w,h,c){ R(x-1,y-1,w+2,h+2,c||'#0a0f1c'); }
// 三段明暗 + 分部件描边的人形
// 轮廓改用各部件自身的暗色（而不是统一黑边），边缘再做 1px 受光/背光处理
function drawHuman(o){
  var x=o.x, y=o.y===undefined?GY:o.y, f=o.face>0?1:-1;
  var step=Math.round(Math.sin(o.walk||0)*2);
  var skin=o.skin||P.skin, skinD=o.skinD||P.skinD, skinL=o.skinL||P.skinL;
  var coat=o.coat||P.coat, coatD=o.coatD||P.coatD, coatL=o.coatL||P.coatL;
  var pants=o.pants||coatD, boots=o.boots||'#080c14';
  var hair=o.hair||P.hair;
  var neon=o.neon||P.cyan;
  var bulk=o.bulk||0;
  var shrug=o.shrug||0;
  var tw=11+bulk*2;                        // 肩宽
  var hw=6+bulk;                           // 头宽
  y=y+(o.bob||0);
  var tx=x-Math.floor(tw/2), ty=y-25-shrug;   // 躯干左上
  var ay=y-24-shrug;                          // 手臂起点
  var hx=x+(f>0?1:0)-Math.floor(hw/2), hy=y-34; // 头左上（比旧版高 1px，脸多一行）
  var l1=x-4+Math.round(step*0.4), l2=x+2-Math.round(step*0.4);
  var a1=ay-Math.round(step*0.5), a2=ay+Math.round(step*0.5);

  // 各部件描边色（自身暗色，带一点环境冷调）
  var oC=dkc(coat), oP=dkc(pants), oS=mix2(skinD,'#2a1a24');
  var oH=dkc(hair);

  // ---------- 接地阴影（三层软过渡） ----------
  A(x-tw/2-4, y+1, tw+8, 1, '#000', 0.14);
  A(x-tw/2-2, y,   tw+4, 1, '#000', 0.28);
  A(x-tw/2,   y,   tw,   2, '#000', 0.40);

  // ---------- 腿 ----------
  R(l1-1,y-13,3,11, oP);
  R(l2-1,y-13,3,11, oP);
  R(l1, y-13, 3, 9, pants);
  R(l2, y-13, 3, 9, mix2(pants,coatD));
  // 大腿受光边 / 膝弯 / 裤缝
  R(l1, y-13, 1, 9, lt(pants,0.30));
  R(l1+1, y-12, 1, 5, '#ffffff', 0.06);
  A(l1, y-7, 3, 1, '#000000', 0.28);
  A(l2, y-7, 3, 1, '#000000', 0.28);
  R(l1+2, y-13, 1, 9, dk(pants,0.35));
  // 靴子：靴筒 / 鞋头 / 鞋底 / 鞋跟（与裤子拉开色阶）
  var bt=mix2(boots,'#2b3852');
  R(l1-1, y-5, 4, 5, bt);
  R(l2-1, y-5, 4, 5, bt);
  R(l1-1, y-5, 4, 1, mix2(bt,'#5a6f92'));
  R(l2-1, y-5, 4, 1, mix2(bt,'#5a6f92'));
  R(l1+(f>0?2:0), y-3, 2, 2, mix2(bt,'#8098bb'));      // 鞋头高光
  R(l2+(f>0?2:0), y-3, 2, 2, mix2(bt,'#8098bb'));
  R(l1-1, y-1, 4, 1, mix2(boots,'#6d84a8'));
  R(l2-1, y-1, 4, 1, mix2(boots,'#6d84a8'));
  A(l1-1, y, 4, 1, '#000000', 0.55);
  A(l2-1, y, 4, 1, '#000000', 0.55);

  // ---------- 躯干 ----------
  var th=12+shrug;
  R(tx-1, ty-1, tw+2, th+2, oC);            // 外套描边
  R(tx, ty, tw, 4, coat);                   // 胸
  R(tx+1, ty+4, tw-2, 4, coat);             // 腰（内收 1px）
  R(tx, ty+8, tw-1, th-8, coat);            // 下摆
  // 三段明暗：顶部受光、右侧背光（按朝向翻转）、下摆压暗
  R(tx, ty, tw, 1, coatL);
  A(tx+tw-3, ty+1, 3, th-1, coatD, 0.55);
  A(tx+1, ty+1, 2, th-2, '#ffffff', 0.14);
  R(tx+1, ty+1, 1, th-3, lt(coat,0.30));
  A(tx+2, ty+2, 1, 3, '#ffffff', 0.10);
  dith(tx+tw-4, ty+1, 2, th-2, coatD, 0.35);
  // 肩线
  R(tx+2, ty+1, tw-4, 1, mix2(coatL,coat));
  // 领口（翻领 V）
  R(tx+2, ty-1, tw-4, 2, dk(coat,0.3));
  R(tx+2, ty-1, tw-4, 1, coatL);
  A(tx+Math.floor(tw/2)-(f>0?1:0), ty+1, 1, 3, coatD, 0.9);
  A(tx+Math.floor(tw/2)-2+(f>0?0:1), ty+2, 1, 1, coatD, 0.7);
  A(tx+Math.floor(tw/2)+1-(f>0?0:1), ty+2, 1, 1, coatD, 0.7);
  // 拉链 / 前襟
  var zx=tx+Math.floor(tw/2);
  R(zx, ty+4, 1, th-5, mix2(coatD,'#0a1220'));
  A(zx, ty+4, 1, 2, '#c9d6e6', 0.55);
  // 口袋
  A(tx+2, ty+7, 3, 1, coatD, 0.75);
  A(tx+tw-5, ty+7, 3, 1, coatD, 0.75);
  // 腰带 + 带扣
  R(tx, y-14, tw, 1, dk(coat,0.5));
  R(tx, y-13, tw, 1, o.belt||'#3a4a6d');
  R(zx-1, y-14, 2, 2, mix2(o.belt||'#3a4a6d','#ffe6a8'));
  A(zx-1, y-14, 1, 1, '#fff3c8', 0.8);
  // 下摆褶皱
  A(tx+2, y-12, 1, 3, coatD, 0.55);
  A(tx+tw-3, y-12, 1, 3, coatD, 0.55);
  // 胸口霓虹条
  if(o.chest){
    var cx2=tx+Math.floor(tw/2)-1+(f>0?2:-2);
    R(cx2, ty+4, 1, 4, neon);
    A(cx2-1, ty+4, 3, 4, neon, 0.22);
    glow(x+(f>0?2:-2), ty+6, 6, neon, (o.glowA||0.16));
  }

  // ---------- 手臂 ----------
  var armB=mix2(mix2(coatD,'#000000'),'#000000');
  R(tx-3, a1-1, 2, 11, oC);
  R(tx-2, a1, 2, 9, armB);
  R(tx-2, a1+9, 2, 2, skinD);
  R(tx+tw+1, a2-1, 2, 11, oC);
  R(tx+tw, a2, 2, 9, coatL);
  A(tx+tw, a2, 1, 9, '#ffffff', 0.12);
  R(tx+tw, a2+9, 2, 2, skin);
  // 袖口
  R(tx-2, a1+8, 2, 1, mix2(coatL,coat));
  R(tx+tw, a2+8, 2, 1, '#ffffff');
  // 手掌（2×2，带暗边与 1px 拇指）
  R(tx-2, a1+9, 2, 3, skinD);
  R(tx-2, a1+9, 2, 1, mix2(skinD,'#000000'));
  R(tx-1, a1+11, 1, 1, mix2(skinD,'#000000'));
  R(tx+tw, a2+9, 2, 3, skin);
  R(tx+tw, a2+11, 2, 1, skinD);
  // 肩甲
  if(o.pad){
    R(tx-3, ay-1, 4, 4, coatD);
    R(tx-3, ay-1, 4, 1, coatL);
    R(tx-3, ay+2, 4, 1, dk(coatD,0.5));
    R(tx+tw-1, ay-1, 4, 4, coatD);
    R(tx+tw-1, ay-1, 4, 1, coatL);
    R(tx+tw-1, ay+2, 4, 1, dk(coatD,0.5));
    A(tx-2, ay, 1, 1, '#ffffff', 0.22);
  }

  // ---------- 颈 ----------
  R(x-1, y-27, 2, 2, skinD);
  A(x-1, y-27, 2, 1, mix2(skinD,'#000'), 0.6);

  // ---------- 围巾 ----------
  if(o.scarf){
    R(x-3, y-27, 6, 1, o.scarfD||'#8a2a58');
    R(x-3, y-26, 6, 2, o.scarf||'#ff5aa0');
    A(x-3, y-26, 6, 1, '#ffffff', 0.20);
    A(x-3, y-25, 6, 1, o.scarfD||'#8a2a58', 0.45);
    if(f>0) R(x+3, y-25, 2, 4, o.scarf||'#ff5aa0');
    else R(x-5, y-25, 2, 4, o.scarf||'#ff5aa0');
    if(f>0) A(x+3, y-25, 1, 4, '#ffffff', 0.18);
  }

  // ---------- 头 ----------
  R(hx-1, hy-1, hw+2, 10, oS);              // 头部描边
  R(hx, hy, hw, 8, skin);                    // 脸（8 行）
  R(hx, hy, hw, 1, skinL);                   // 额受光
  // 背光侧压暗（按朝向）
  if(f>0){ R(hx+hw-1, hy+1, 1, 7, skinD); A(hx+hw-2, hy+2, 1, 5, skinD, 0.55); }
  else   { R(hx, hy+1, 1, 7, skinD);       A(hx+1, hy+2, 1, 5, skinD, 0.55); }
  // 颧骨 / 下颌收窄 / 下巴
  A(hx+(f>0?2:hw-3), hy+4, 1, 1, skinL, 0.55);
  A(hx, hy+5, 1, 3, skinD, 0.85);
  A(hx+hw-1, hy+5, 1, 3, skinD, 0.85);
  R(hx+1, hy+7, hw-2, 1, mix2(skinD,skin));
  A(hx+1, hy+7, hw-2, 1, '#000000', 0.22);
  A(hx+(f>0?hw-3:1), hy+6, 1, 1, skinD, 0.7);
  A(hx+1, hy+6, hw-2, 1, skinD, 0.22);
  // 耳朵
  R(hx+(f>0?-1:hw), hy+3, 1, 2, mix2(skinD,skin));

  // 头发 / 帽子
  if(o.hat==='cap'){
    R(hx-2, hy-3, hw+4, 3, o.hatC||'#28344c');
    R(hx-2, hy-3, hw+4, 1, o.hatL||'#41506a');
    A(hx-1, hy-2, hw+2, 1, '#ffffff', 0.10);
    // 帽檐
    R(hx+(f>0?hw-1:-3), hy, 4, 1, o.hatC||'#28344c');
    R(hx+(f>0?hw-1:-3), hy, 4, 1, dk(o.hatC||'#28344c',0.4));
    R(hx, hy, hw, 1, hair);
    A(hx+1, hy, hw-2, 1, mix2(hair,'#4a5a78'), 0.8);

// ---------- 调色与纹理工具 ----------
function dk(c,k){                       // 变暗（拉向冷黑，不发灰）
  var t=k===undefined?0.5:k;
  return mix2(mix2(c,'#03060d'),t>0.5?'#03060d':c);
}
function lt(c,k){                       // 变亮（拉向暖白）
  var t=k===undefined?0.5:k;
  return mix2(mix2(c,'#fff6e0'),(t>0.5?'#fff6e0':c));
}
function dkc(c){ return mix2(mix2(mix2(c,'#04070f'),'#04070f'),'#04070f'); }
// 2×2 棋盘抖动：在两种颜色之间做像素级过渡，消除大块平涂
function dith(x,y,w,h,c,a){
  if(a===undefined) a=0.5;
  x=Math.round(x); y=Math.round(y); w=Math.round(w); h=Math.round(h);
  for(var yy=0;yy<h;yy++){
    for(var xx=(yy%2);xx<w;xx+=2){
      A(x+xx,y+yy,1,1,c,a);
    }
  }
}
// 竖向渐变抖动（上疏下密）
function dithV(x,y,w,h,c,a0,a1){
  x=Math.round(x); y=Math.round(y); w=Math.round(w); h=Math.round(h);
  for(var yy=0;yy<h;yy++){
    var a=a0+(a1-a0)*(h<=1?1:yy/(h-1));
    A(x,y+yy,w,1,c,a*0.5);
    for(var xx=(yy%2);xx<w;xx+=2) A(x+xx,y+yy,1,1,c,a);
  }
}
function panelLine(x,y,w,c,a){ A(x,y,w,1,c,a===undefined?0.5:a); }

function mix2(c1,c2){
  var a1=parseInt(c1.substr(1,2),16),b1=parseInt(c1.substr(3,2),16),d1=parseInt(c1.substr(5,2),16);
  var a2=parseInt(c2.substr(1,2),16),b2=parseInt(c2.substr(3,2),16),d2=parseInt(c2.substr(5,2),16);
  function hx(v){ v=Math.max(0,Math.min(255,Math.round(v))); return (v<16?'0':'')+v.toString(16); }
  return '#'+hx((a1+a2)/2)+hx((b1+b2)/2)+hx((d1+d2)/2);
}

function drawNightOverlay(){
  if(G.phase!=='night'&&G.phase!=='dusk') return;
  var a=G.phase==='night'?1:1-(G.t/DUSK_LEN);
  ctx.fillStyle='rgba(8,10,30,'+(0.30*a).toFixed(3)+')';
  ctx.fillRect(0,0,VW,GY+8);
  var g1=ctx.createRadialGradient(160,GY-20,6,160,GY-20,96);
  g1.addColorStop(0,'rgba(255,196,90,'+(0.13*a).toFixed(3)+')');
  g1.addColorStop(1,'rgba(255,196,90,0)');
  ctx.fillStyle=g1;

  ctx.fillStyle=g2;
  ctx.fillRect(0,0,VW,64);

function drawRain(){
  if(!G.rain) return;
  ctx.lineWidth=1;
  for(var i=0;i<64;i++){
    var x=((i*53+G.tick*90)%(VW+60))-30;
    var y=((i*71+G.tick*260)%(GY+30))-20;
    var len=4+((i*7)%4);
    var a=0.09+((i%5)*0.03);
    ctx.strokeStyle='rgba(150,200,255,'+a.toFixed(2)+')';
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x-2,y+len); ctx.stroke();
  }
  for(var j=0;j<14;j++){
    var sx=((j*97+G.tick*140)%(VW+40))-20;
    var ph=(G.tick*2.2+j*0.7)%1;
    if(ph<0.25){
      var r=1+ph*8;
      SA(sx-r/2,GY+3,r,1,'#9ec8ff',0.16*(1-ph*4));
    }
  }
}

function buildSheet(name){
  var d=SHEET_DEFS[name];
  if(!d) return null;
  var items=d.items();
  var rows=Math.ceil(items.length/d.cols);
  var labelH=16;
  var W=d.cols*d.cellW+20, H=26+rows*(d.cellH+labelH)+10;
  var S=d.scale;
  var sheet=mkCanvas(W*S,H*S);
  if(!sheet) return null;
  var g=sheet.g;
  g.imageSmoothingEnabled=false;
  g.setTransform(S,0,0,S,0,0);
  // 背景
  g.fillStyle='#080b12'; g.fillRect(0,0,W,H);
  g.fillStyle='#0d1320'; g.fillRect(0,0,W,20);
  g.fillStyle='#101a2a';
  for(var bx=0;bx<W;bx+=8) g.fillRect(bx,20,1,H-20);
  g.fillStyle='#7ff0c4';
  g.font='9px "Microsoft YaHei",sans-serif';
  g.textBaseline='top';
  g.fillText(d.title, 8, 6);
  // 单元格
  for(var i=0;i<items.length;i++){
    var it=items[i];
    var col=i%d.cols, row=Math.floor(i/d.cols);
    var cx=10+col*d.cellW, cy=24+row*(d.cellH+labelH);
    g.fillStyle='#0a0f18';
    g.fillRect(cx,cy,d.cellW-4,d.cellH-2);
    g.fillStyle='#141d2c';
    g.fillRect(cx,cy,d.cellW-4,1);
    // 地面线
    g.fillStyle='#1b2636';
    g.fillRect(cx+2,cy+d.ground,d.cellW-8,1);
    var cell=renderCell(d.cellW-4,d.cellH,d.ground,function(cc){
      it.draw(d.cellW/2-2,d.ground);
    });
    if(cell) g.drawImage(cell,cx+2,cy+2,d.cellW-4,d.cellH-2);
    // 标签
    g.fillStyle='#cfe0f5';
    g.font='7px "Microsoft YaHei",sans-serif';
    g.fillText(it.label, cx+3, cy+d.cellH+1);
    g.fillStyle='#5f7a9a';
    g.font='6px "Microsoft YaHei",sans-serif';
    g.fillText(it.sub||'', cx+3, cy+d.cellH+8);
  }
  return sheet.c;
}

function drawDuskIntel(){
  if(G.phase!=='dusk'||!G.intel) return;
  var left=G.intel.side<0;
  var x=left?10:VW-10;
  var a=0.55+0.35*Math.sin(G.tick*4);
  var cy=GY-42;
  ctx.fillStyle=rgba('#ff5a4a',a);
  ctx.beginPath();
  if(left){ ctx.moveTo(x-5,cy); ctx.lineTo(x+6,cy-8); ctx.lineTo(x+6,cy+8); }
  else { ctx.moveTo(x+5,cy); ctx.lineTo(x-6,cy-8); ctx.lineTo(x-6,cy+8); }
  ctx.closePath();
  ctx.fill();
  var tx=left?(x+13):(x-13-((''+G.intel.count).length*4-1));
  text3S(tx,cy-2,'x'+G.intel.count,'#ff8f5a');
  // 顶部提示条：第几波 / 之后还有几波
  A(0,10,VW,9,'#0a0f1a',0.55);
  var total=(G.plan&&G.plan.length)?G.plan.length:1;
  var label=(left?'ENEMY LEFT':'ENEMY RIGHT')+' '+1+'/'+total;
  text3S(VW/2-text3W(label)/2,12,label,'#ff8f5a');
}

  drawSky();

  drawHoloAds(night);
  drawGround();
  drawUtilities();
  drawProps(night);
  drawHardware();
  drawHome();
  for(var i=0;i<slots.length;i++){ if(slots[i].st) drawStructure(slots[i].st); }
  drawReflections(night);
  drawOrderGhost();
  drawCenterDoor();
  drawNpcStreet();
  drawXiao();
  drawZhou();
  for(var j=0;j<G.fighters.length;j++) drawFighter(G.fighters[j]);
  for(var k=0;k<G.enemies.length;k++) drawEnemy(G.enemies[k]);
  drawPlayer();
  drawCoins();
  drawProjs();
  drawParts();
  drawPrompt();
  drawTutArrow();
  if(G.userPaused){
    A(0,0,VW,VH,'#04060d',0.45);
    var ptxt='PAUSED';

  }
  drawDuskIntel();
  drawNightOverlay();

  if(G.flash>0){
    ctx.fillStyle='rgba(255,80,80,'+(G.flash*0.6).toFixed(2)+')';
    ctx.fillRect(0,0,VW,VH);
  }
  var pw=clamp(G.dayRevenue/Math.max(1,G.dayTarget),0,1);
  var pby=VH-4;
  ctx.fillStyle='rgba(6,10,18,0.72)';
  ctx.fillRect(VW/2-31,pby,62,4);
  ctx.fillStyle='#121a29';
  ctx.fillRect(VW/2-30,pby+1,60,2);
  ctx.fillStyle=G.dayRevenue>=G.dayTarget?'#7ff0c4':'#3ee9ff';
  ctx.fillRect(VW/2-30,pby+1,60*pw,2);
}
// ============================== 主循环 ==============================
var last=0;
var _loopErrs=0;
function loop(ts){
  // 单帧异常不能杀死整个循环：rAF 在末尾重新登记，
  // 一旦 update/draw 抛错就会永久停帧（手机上表现为“直接卡死”）。
  try{
    if(!last) last=ts;
    var dt=(ts-last)/1000; last=ts;
    if(dt>0.1) dt=0.1;
    if(!G.paused && !G.userPaused && G.started && !G.over){
      G.tick+=dt;
      var sdt=dt*G.speed;
      updatePlayer(sdt);
      if(G.phase==='day'||G.phase==='dusk'||G.phase==='night') updateShops(sdt);
      updateCoins(sdt);
      if(G.phase==='night'){
        updateEnemies(dt*G.speed); updateTurrets(dt*G.speed); updateTraps(dt*G.speed); updateProjs(dt*G.speed);
      }
      updateFighters(dt*G.speed);
      if(G.flash>0) G.flash-=dt;
      for(var i=G.parts.length-1;i>=0;i--){
        var p=G.parts[i]; p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; if(!p.nograv) p.vy+=200*dt;
        if(p.life<=0) G.parts.splice(i,1);
      }
      updatePhase(dt);
      updateTutorial();
      syncObjective();
      checkNpcTasks();
      storyCheck();
    }
    if(!window.__NODRAW__) draw();
  }catch(err){
    _loopErrs++;
    window.__LASTERR__=String((err&&err.message)||err);
    if(_loopErrs<=3){ try{ console.error('[zero-neon] frame error:',err); }catch(e2){} }
  }
  requestAnimationFrame(loop);
}
