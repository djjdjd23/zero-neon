<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>零点霓虹 · Zero Neon</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none!important;-webkit-user-select:none!important;-moz-user-select:none!important;
    -ms-user-select:none!important;user-select:none!important;-webkit-user-drag:none}
  ::selection{background:transparent!important;color:inherit!important}
  ::-moz-selection{background:transparent!important}
  ::-webkit-selection{background:transparent!important}
  html,body{margin:0;padding:0;height:100%;width:100%;background:#04050a;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",monospace;
    color:#e6ecf5;touch-action:none;overscroll-behavior:none;
    -webkit-touch-callout:none!important;-webkit-user-select:none!important;user-select:none!important;
    -webkit-text-size-adjust:100%;position:fixed;inset:0}
  canvas,img{-webkit-user-drag:none;user-drag:none;-webkit-user-select:none;user-select:none;pointer-events:none}

  canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;-ms-interpolation-mode:nearest-neighbor}
  .hud{position:absolute;pointer-events:none;font-size:calc(var(--s)*7.4);line-height:1.25;letter-spacing:.02em;text-shadow:0 1px 0 #000,0 0 4px #000}
  #top{top:calc(var(--s)*3);left:calc(var(--s)*4);right:calc(var(--s)*4);display:flex;flex-direction:column;gap:calc(var(--s)*2);align-items:flex-start}
  #top .chiprow{display:flex;gap:calc(var(--s)*3);align-items:center;flex-wrap:wrap}
  #bot{display:none}
  .chip{background:rgba(8,11,20,.72);border:1px solid #22304a;border-radius:calc(var(--s)*2);padding:calc(var(--s)*1.5) calc(var(--s)*3.5);white-space:nowrap}
  .val{color:#ffd86b}
  .pre{color:#7ff0c4}
  .pw{color:#7cc7ff}
  .warn{color:#ff6b6b}
  .speedbar{pointer-events:auto;display:flex;gap:calc(var(--s)*2);align-items:center}
  #top .npcchip{pointer-events:auto;cursor:pointer;border-color:#31456a;color:#c3cee0;max-width:calc(var(--s)*150);overflow:hidden;text-overflow:ellipsis}
  #top .npcchip.near{border-color:#3d6fae;color:#8fd3ff}
  #top .npcchip.ready{border-color:#7ff0c4;color:#7ff0c4;animation:chipGlow 1.4s ease-in-out infinite}
  @keyframes chipGlow{0%,100%{box-shadow:0 0 0 0 rgba(127,240,196,0)}50%{box-shadow:0 0 0 calc(var(--s)*1.6) rgba(127,240,196,.35)}}
  #toast{position:absolute;z-index:40;left:50%;top:calc(var(--s)*47);transform:translate(-50%,-6px);
    background:rgba(10,16,28,.92);border:1px solid #4a6288;border-left:calc(var(--s)*1.6) solid #ffd86b;
    border-radius:calc(var(--s)*2);padding:calc(var(--s)*2) calc(var(--s)*4);font-size:calc(var(--s)*7);
    pointer-events:none;opacity:0;transition:opacity .25s ease,transform .25s ease;white-space:nowrap;
    text-shadow:0 1px 0 #000;box-shadow:0 0 calc(var(--s)*6) rgba(0,0,0,.7)}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  .btn{pointer-events:auto;font-family:inherit;font-size:calc(var(--s)*7.4);color:#cfd8ea;background:#151c2b;
    border:1px solid #2c3a55;border-radius:calc(var(--s)*2);padding:calc(var(--s)*2) calc(var(--s)*4);cursor:pointer}
  .btn:active{background:#243049}
  .btn.on{background:#2f6bd8;border-color:#5f9cff;color:#fff}
  .btn.off{opacity:.4}
  #pad{position:absolute;left:0;right:0;bottom:0;height:38%;display:flex;align-items:flex-end;
    justify-content:space-between;padding:calc(var(--s)*6);pointer-events:none}
  #pad .side{display:flex;gap:calc(var(--s)*5);pointer-events:auto}
  .big{width:calc(var(--s)*30);height:calc(var(--s)*30);border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:rgba(20,28,44,.6);border:1px solid #33456a;font-size:calc(var(--s)*11);color:#cfd8ea;
    touch-action:none;-webkit-user-select:none;user-select:none;pointer-events:auto;position:relative}
  .big:active,.big.down{background:rgba(50,70,110,.85);border-color:#6b8fc8}
  #eBtn{width:calc(var(--s)*36);height:calc(var(--s)*36);font-size:calc(var(--s)*9)}
  /* 全屏透明盾：所有触摸都落在它身上（它没有文字，长按不会触发选区菜单） */
  #shield{position:absolute;inset:0;z-index:10;background:transparent;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
  /* HUD 按钮要浮在盾之上才能点 */
  #top{position:absolute;z-index:30;pointer-events:none}
  #top .speedbar,#top .speedbar *{pointer-events:auto}
  #pad{position:absolute;z-index:6;pointer-events:none}
  #pad .big{pointer-events:none}
  #obj{position:absolute;z-index:7}
  /* ---------- 开场 / 选档 ---------- */
  .ovl{position:absolute;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at 50% 38%,rgba(12,22,40,.90) 0%,rgba(4,6,12,.97) 72%);
    font-size:calc(var(--s)*8);color:#dbe7f7;overflow:hidden}
  #game.title-mode #top,#game.title-mode #obj,#game.title-mode #pad,#game.title-mode #toast{display:none!important}
  .ovl::after{content:'';position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.32) 0 1px,transparent 1px 3px);opacity:.5}
  .tt-inner{position:relative;z-index:2;text-align:center;padding:calc(var(--s)*4)}
  .tt-kicker{font-size:calc(var(--s)*5.4);letter-spacing:.42em;color:#4f7fa8;margin-bottom:calc(var(--s)*2)}
  .tt-logo{position:relative;margin:0;font-size:calc(var(--s)*27);line-height:1;letter-spacing:.06em;font-weight:800;
    color:#eaf6ff;text-shadow:0 0 calc(var(--s)*5) rgba(62,233,255,.55),0 0 calc(var(--s)*16) rgba(255,63,164,.35)}
  .tt-logo span{color:#3ee9ff;margin-left:.06em}
  .tt-cn{margin-top:calc(var(--s)*1.4);font-size:calc(var(--s)*9);letter-spacing:.16em;color:#ff5aa0;
    text-shadow:0 0 calc(var(--s)*5) rgba(255,90,160,.5)}
  .tt-tag{margin-top:calc(var(--s)*3);font-size:calc(var(--s)*6.6);color:#8fa3bd}
  .tt-btns{margin-top:calc(var(--s)*6);display:flex;gap:calc(var(--s)*3.2);justify-content:center;align-items:center;flex-wrap:wrap}
  .tt-main{font-size:calc(var(--s)*9.6)!important;padding:calc(var(--s)*3.4) calc(var(--s)*9)!important;
    border-color:#3d7fd0!important;background:#16324f!important;letter-spacing:.12em}
  .tt-main:active{background:#22496f!important}
  .tt-foot{margin-top:calc(var(--s)*5);font-size:calc(var(--s)*5.2);color:#4a5b72;letter-spacing:.1em}
  .tt-credit{margin-top:calc(var(--s)*1.6);font-size:calc(var(--s)*4.4);color:#33445c;letter-spacing:.04em}
  .sl-inner{position:relative;z-index:2;width:100%;max-width:calc(var(--s)*250);padding:0 calc(var(--s)*6)}
  .sl-inner h2{margin:0 0 calc(var(--s)*4);text-align:center;font-size:calc(var(--s)*10);color:#8fd3ff;font-weight:600;letter-spacing:.2em}
  .sl-list{display:flex;flex-direction:column;gap:calc(var(--s)*2.6)}
  .sl-card{display:flex;align-items:center;gap:calc(var(--s)*3);padding:calc(var(--s)*3) calc(var(--s)*3.4);
    border:1px solid #1f2d44;border-radius:calc(var(--s)*2);background:#0b1220;cursor:pointer}
  .sl-card:active{background:#131e33}
  .sl-card.empty{opacity:.72;border-style:dashed}
  .sl-no{width:calc(var(--s)*14);height:calc(var(--s)*14);flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    border-radius:calc(var(--s)*2);background:#13203a;border:1px solid #2a3d5c;font-size:calc(var(--s)*7);color:#8fd3ff}
  .sl-body{flex:1;min-width:0}
  .sl-title{font-size:calc(var(--s)*7.4);color:#e6eefb}
  .sl-meta{font-size:calc(var(--s)*5.6);color:#7f8da8;margin-top:calc(var(--s)*.6);line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sl-meta b{color:#ffd86b;font-weight:600}
  .sl-del{flex:0 0 auto;font-size:calc(var(--s)*5.6);color:#b8434f;border:1px solid #4a2129;border-radius:calc(var(--s)*1.6);
    padding:calc(var(--s)*1.2) calc(var(--s)*2.4);background:#1a0d12}
  .sl-del:active{background:#2a1218}
  .sl-foot{margin-top:calc(var(--s)*4);display:flex;justify-content:center;gap:calc(var(--s)*3)}
  /* 音量条 */
  .vol{display:flex;align-items:center;gap:calc(var(--s)*2);padding:calc(var(--s)*2.4) calc(var(--s)*3);
    border:1px solid #1d2740;border-radius:calc(var(--s)*2);background:#101728;margin-bottom:calc(var(--s)*2);
    font-size:calc(var(--s)*7)}
  .vol input{flex:1;accent-color:#3ee9ff;height:calc(var(--s)*3)}
  #panelWrap{z-index:90}
  .pulse{animation:btnPulse 1.05s ease-in-out infinite}
  @keyframes btnPulse{
    0%,100%{box-shadow:0 0 0 0 rgba(255,216,107,0);border-color:#33456a}
    50%{box-shadow:0 0 0 calc(var(--s)*2.4) rgba(255,216,107,.5);border-color:#ffd86b;color:#fff}
  }
  .tip{position:fixed;transform:translate(-50%,-100%);pointer-events:none;display:none;z-index:10;
    background:rgba(10,20,38,.94);border:1px solid #3d6fae;border-radius:calc(var(--s,1px)*2);
    padding:calc(var(--s,1px)*1.6) calc(var(--s,1px)*3.2);font-size:calc(var(--s,1px)*7);color:#dbe7f7;
    white-space:nowrap;text-shadow:0 1px 0 #000;box-shadow:0 0 calc(var(--s,1px)*4) rgba(0,0,0,.8)}
  .tip.show{display:block}
  .tip b{color:#ffd86b}
  #panelWrap{position:absolute;inset:0;background:rgba(3,5,10,.72);display:none;align-items:center;justify-content:center;padding:calc(var(--s)*8);pointer-events:auto}
  #panelWrap.show{display:flex}
  #panel{width:100%;max-width:calc(var(--s)*210);max-height:100%;overflow-y:auto;background:#0c1120;
    border:1px solid #2c3a55;border-radius:calc(var(--s)*3);padding:calc(var(--s)*5);box-shadow:0 0 0 calc(var(--s)*1) #05070d inset}
  #panel h3{margin:0 0 calc(var(--s)*3);font-size:calc(var(--s)*8.6);color:#8fd3ff;font-weight:600}
  #panel .row{display:flex;align-items:center;justify-content:space-between;gap:calc(var(--s)*4);
    padding:calc(var(--s)*2.4) calc(var(--s)*3);border:1px solid #1d2740;border-radius:calc(var(--s)*2);
    margin-bottom:calc(var(--s)*2);background:#101728;cursor:pointer;font-size:calc(var(--s)*7.2)}
  #panel .row:active{background:#1a2440}
  #panel .row.dis{opacity:.38}
  #panel .row .l{display:flex;flex-direction:column;gap:calc(var(--s)*.6)}
  #panel .row .sub{font-size:calc(var(--s)*6);color:#7f8da8}
  #panel .row .r{color:#ffd86b;font-size:calc(var(--s)*7);white-space:nowrap}
  #panel .txt{font-size:calc(var(--s)*7);line-height:1.6;color:#c3cee0;margin-bottom:calc(var(--s)*3)}
  #panel .foot{display:flex;gap:calc(var(--s)*3);margin-top:calc(var(--s)*3)}
  #panel .foot .btn{flex:1;text-align:center}
  #rotate{position:fixed;inset:0;background:#04050a;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:99;text-align:center;padding:24px}
  #rotate.show{display:flex}
  #rotate .ico{width:56px;height:96px;border:3px solid #3a4d70;border-radius:10px;animation:rot 2s ease-in-out infinite}
  @keyframes rot{0%,40%{transform:rotate(0)}60%,100%{transform:rotate(90deg)}}
  #rotate p{font-size:15px;color:#8fa0bb;margin:0}
  #rotate .sub{font-size:13px;color:#5c6b85}
  /* 竖屏时旋转整个游戏容器 */
  #game.rotated{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) rotate(90deg)}
  #game.rotated.alt{transform:translate(-50%,-50%) rotate(-90deg)}
  #flipBtn{display:none}
  #game.rotated #flipBtn{display:inline-block}
  #obj{position:absolute;left:calc(var(--s)*4);top:calc(var(--s)*32);right:calc(var(--s)*4);
    pointer-events:none;font-size:calc(var(--s)*7);line-height:1.4}
  #obj .box{display:inline-block;max-width:100%;background:rgba(10,20,38,.86);border:1px solid #3d6fae;
    border-left:calc(var(--s)*1.6) solid #ffd86b;border-radius:calc(var(--s)*2);
    padding:calc(var(--s)*1.8) calc(var(--s)*3.2);color:#dbe7f7;text-shadow:0 1px 0 #000}
  #obj .step{color:#ffd86b}
  #obj.hide{display:none}
  #objBox{display:inline-block;max-width:100%;background:rgba(10,20,38,.86);border:1px solid #3d6fae;
    border-left:calc(var(--s)*1.6) solid #ffd86b;border-radius:calc(var(--s)*2);
    padding:calc(var(--s)*1.8) calc(var(--s)*3.2);color:#dbe7f7;text-shadow:0 1px 0 #000}
  #objBox .step{color:#ffd86b}
  #objBox .arrow{color:#ffd86b;margin-left:calc(var(--s)*2);animation:blink 0.9s steps(2,end) infinite}
  @keyframes blink{50%{opacity:.15}}
</style>
</head>
<body>
<div id="stage">
  <div id="game">
    <canvas id="c" width="320" height="180"></canvas>

    <div class="hud" id="top">
      <div class="chiprow">
        <div class="chip"><span id="hDay">第 1 天</span>·<span id="hPhase">白天</span> <span id="hTime">200</span></div>
        <div class="chip">💰<span class="val" id="hPurse">300</span> 库<span class="val" id="hVault">0</span></div>
        <div class="chip">⭐<span class="pre" id="hPre">30</span> ⚡<span class="pw" id="hPower">0/10</span></div>
        <div class="chip npcchip" id="npcChip">招募 · —</div>
      </div>
      <div class="chip speedbar">
        <button class="btn on" data-sp="1">1×</button>
        <button class="btn" data-sp="2">2×</button>
        <button class="btn" data-sp="4">4×</button>
        <button class="btn" id="deployBtn">布防</button>
        <button class="btn" id="pauseBtn">II</button>
        <button class="btn" id="skipBtn" style="display:none">跳过</button>
        <button class="btn" id="flipBtn">翻转</button>
        <button class="btn" id="menuBtn">菜单</button>
      </div>
    </div>

    <div id="toast"></div>

    <div id="obj"><div class="box" id="objBox"><span id="objText"></span><span class="arrow" id="objArrow">◀</span></div></div>

    <div id="pad">
      <div class="side">
        <div class="big" id="leftBtn">◀</div>
        <div class="big" id="rightBtn">▶</div>
      </div>
      <div class="side">
        <div class="big" id="eBtn">E</div>
      </div>
    </div>

    <div id="titleScr" class="ovl" style="display:none">
      <div class="tt-inner">
        <div class="tt-kicker">QINGHE STREET · 2087</div>
        <h1 class="tt-logo">ZERO<span>NEON</span></h1>
        <div class="tt-cn">零点霓虹</div>
        <div class="tt-tag">白天做生意，夜里……有人会来砸。</div>
        <div class="tt-btns">
          <button class="btn tt-main" id="ttStart">开始游戏</button>
          <button class="btn" id="ttHelp">玩法说明</button>
          <button class="btn" id="ttAudio">音效：开</button>
        </div>
        <div class="tt-foot">建议横屏 · 三个存档槽 · 每晚自动保存</div>
        <div class="tt-credit">音乐 Retro Synthwave Loops · Tomasz Kucza（CC BY 4.0）</div>
      </div>
    </div>

    <div id="slotScr" class="ovl" style="display:none">
      <div class="sl-inner">
        <h2>选择存档</h2>
        <div class="sl-list" id="slList"></div>
        <div class="sl-foot"><button class="btn" id="slBack">返回</button></div>
      </div>
    </div>

    <div id="shield"></div>

    <div class="tip" id="tip"></div>

    <div id="panelWrap"><div id="panel"></div></div>
  </div>
</div>
<div id="rotate"><div class="ico"></div><p>请横屏游玩<br><span style="font-size:13px;color:#5c6b85">横过来才能守住这条街</span></p></div>

// ============================== 金库分段计息 ==============================
// 累进（边际）计息：每一段钱按各自的日利率生息，存得越多整体利率越高，
// 但跨档时不会出现“多存 1 块利息暴涨”的断层。
// 单日利息 = Σ 各段金额 × 该段日利率，最高边际 4%/天（低于贷款 5%/天，借钱来存不划算）。
var VAULT_TIERS=[
  {up:2000,     rate:0.020},   // 0 ~ 2,000        2.0%
  {up:10000,    rate:0.025},   // 2,000 ~ 1 万     2.5%
  {up:30000,    rate:0.030},   // 1 万 ~ 3 万      3.0%
  {up:100000,   rate:0.035},   // 3 万 ~ 10 万     3.5%
  {up:Infinity, rate:0.040}    // 10 万以上        4.0%
];
// 梅姐的加成只作用于 3 万以内的部分：否则「借钱→存钱」在后期能白嫖利差
var VAULT_BONUS_CAP=30000;
function vaultMeiMul(){ return hasNpc('mei')?2:1; }
// 单日利息（含梅姐加成）。v = 金库余额
function vaultInterest(v){
  if(!(v>0)) return 0;
  var m=vaultMeiMul(), lo=0, sum=0;
  for(var i=0;i<VAULT_TIERS.length;i++){
    if(v<=lo) break;
    var hi=VAULT_TIERS[i].up;
    var bonus=(lo<VAULT_BONUS_CAP)?m:1;
    sum+=(Math.min(v,hi)-lo)*VAULT_TIERS[i].rate*bonus;
    lo=hi;
  }
  return sum;
}
// 钱现在所处的档位利率（边际利率，未含梅姐加成时用得上）
function vaultRateAt(v){
  for(var i=0;i<VAULT_TIERS.length;i++) if(v<=VAULT_TIERS[i].up) return VAULT_TIERS[i].rate;
  return VAULT_TIERS[VAULT_TIERS.length-1].rate;
}
// 综合利率 = 总利息 / 总存款，用来显示“日息 X%”
function vaultEffRate(v){
  if(!(v>0)) return VAULT_TIERS[0].rate*vaultMeiMul();
  return vaultInterest(v)/v;
}
// 下一档还差多少（at = 跨档门槛，rate = 跨过去后新增那部分的利率，已含加成）
function vaultNextTier(v){
  for(var i=0;i<VAULT_TIERS.length-1;i++){
    var hi=VAULT_TIERS[i].up;
    if(v<hi) return {need:Math.ceil(hi-v), at:hi, rate:VAULT_TIERS[i+1].rate*((hi<VAULT_BONUS_CAP)?vaultMeiMul():1)};
  }
  return null;
}

// ============================== 音频引擎（Web Audio 实时合成） ==============================
// 目标音色：合成器浪潮（synthwave）——多层振荡器 + 低通包络 + 卷积混响
var AU={ctx:null,master:null,bgmGain:null,sfxGain:null,rev:null,revGain:null,
  bgm:true,sfx:true,mode:'off',timer:null,step:0,nextT:0,noiseBuf:null};
var AU_KEY='zn_audio_v2';

function auLoadPrefs(){
  try{
    var d=JSON.parse(localStorage.getItem(AU_KEY)||'{}');
    if(typeof d.bgm==='boolean') AU.bgm=d.bgm;
    if(typeof d.sfx==='boolean') AU.sfx=d.sfx;
  }catch(e){}
}
function auSavePrefs(){
  try{ localStorage.setItem(AU_KEY,JSON.stringify({bgm:AU.bgm,sfx:AU.sfx})); }catch(e){}
}
function mf(n){ return 440*Math.pow(2,(n-69)/12); }

function auInit(){
  if(AU.ctx){
    if(AU.ctx.state==='suspended'){ try{ AU.ctx.resume(); }catch(e){} }
    auPhaseBgm();
    return;
  }
  var AC=window.AudioContext||window.webkitAudioContext;
  if(!AC) return;
  try{ AU.ctx=new AC(); }catch(e){ return; }
  var c=AU.ctx;
  AU.master=c.createGain(); AU.master.gain.value=0.9; AU.master.connect(c.destination);

  // 卷积混响：程序生成 2.2 秒衰减脉冲
  try{
    var rl=Math.floor(c.sampleRate*2.2);
    var ir=c.createBuffer(2,rl,c.sampleRate);
    for(var ch=0;ch<2;ch++){
      var d=ir.getChannelData(ch);
      for(var i=0;i<rl;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/rl,2.8);
    }
    AU.rev=c.createConvolver(); AU.rev.buffer=ir;
    AU.revGain=c.createGain(); AU.revGain.gain.value=0.6;
    AU.rev.connect(AU.revGain); AU.revGain.connect(AU.master);
  }catch(e){ AU.rev=null; }

  AU.bgmGain=c.createGain(); AU.bgmGain.gain.value=AU.bgm?0.55:0; AU.bgmGain.connect(AU.master);
  AU.sfxGain=c.createGain(); AU.sfxGain.gain.value=AU.sfx?0.6:0; AU.sfxGain.connect(AU.master);

  var len=Math.floor(c.sampleRate*0.6);
  try{
    AU.noiseBuf=c.createBuffer(1,len,c.sampleRate);
    var nd=AU.noiseBuf.getChannelData(0);
    for(var j=0;j<len;j++) nd[j]=Math.random()*2-1;
  }catch(e){ AU.noiseBuf=null; }

  auPhaseBgm();
  if(typeof setTimeout==='function') setTimeout(function(){ try{ preloadMusic(); }catch(e){} },900);
}
function auSetBgm(on){
  AU.bgm=!!on; auSavePrefs();
  if(AU.bgmGain) AU.bgmGain.gain.value=AU.bgm?0.55:0;
}
function auSetSfx(on){
  AU.sfx=!!on; auSavePrefs();
  if(AU.sfxGain) AU.sfxGain.gain.value=AU.sfx?0.6:0;
}

// 一个"声部"：多层振荡器 + 滤波包络 + ADSR + 混响发送
function auVoice(o){
  var c=AU.ctx; if(!c) return;
  var t=(o.when===undefined||o.when===null)?c.currentTime:o.when;
  var dur=o.dur||0.2;
  var dest=o.dest||AU.bgmGain;
  var g=c.createGain();
  var tail=g;
  if(o.cutoff){
    var f=c.createBiquadFilter();
    f.type=o.filter||'lowpass';
    try{
      f.frequency.setValueAtTime(o.cutoff,t);
      if(o.cutoffEnd) f.frequency.exponentialRampToValueAtTime(Math.max(60,o.cutoffEnd),t+dur);
    }catch(e){}
    f.Q.value=o.q||0.9;
    g.connect(f); tail=f;
  }
  tail.connect(dest);
  if(o.rev&&AU.rev){
    var s=c.createGain(); s.gain.value=o.rev;
    tail.connect(s); s.connect(AU.rev);
  }
  var att=o.attack||0.008;
  var vol=Math.max(0.0002,o.vol||0.12);
  try{
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+att);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  }catch(e){}
  var n=o.voices||1;
  for(var i=0;i<n;i++){
    var osc=c.createOscillator();
    osc.type=o.type||'sine';
    try{
      osc.frequency.setValueAtTime(o.f,t);
      if(o.glide) osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.glide),t+dur*0.85);
      if(n>1) osc.detune.setValueAtTime((i-(n-1)/2)*(o.spread||8),t);
    }catch(e){}
    osc.connect(g);
    try{ osc.start(t); osc.stop(t+dur+0.06); }catch(e){}
  }
}
function auNoise(dur,vol,freq,when,type,dest){
  var c=AU.ctx; if(!c||!AU.noiseBuf) return;
  var t=(when===undefined||when===null)?c.currentTime:when;
  var src=c.createBufferSource(); src.buffer=AU.noiseBuf;
  var f=c.createBiquadFilter(); f.type=type||'bandpass';
  f.frequency.value=freq||1200; f.Q.value=0.9;
  var g=c.createGain();
  try{
    g.gain.setValueAtTime(vol||0.2,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  }catch(e){}
  src.connect(f); f.connect(g); g.connect(dest||AU.sfxGain);
  try{ src.start(t); src.stop(t+dur+0.03); }catch(e){}
}

var SFX_BUF={}, SFX_LOADING={};
function loadSfx(name){
  if(SFX_BUF[name]||SFX_LOADING[name]) return;
  if(typeof fetch!=='function'||!AU.ctx) return;
  var url=SFX_FILE[name]; if(!url) return;
  SFX_LOADING[name]=true;
  fetch(url)
    .then(function(r){ if(!r.ok) throw new Error('http '+r.status); return r.arrayBuffer(); })
    .then(function(ab){
      return new Promise(function(res,rej){
        try{ AU.ctx.decodeAudioData(ab,res,rej); }catch(e){ rej(e); }
      });
    })
    .then(function(buf){ SFX_BUF[name]=buf; SFX_LOADING[name]=false; })
    .catch(function(){ SFX_LOADING[name]=false; });
}
function playSfx(name,vol,rate){
  var b=SFX_BUF[name]; if(!b||!AU.ctx) return false;
  try{
    var c=AU.ctx, s=c.createBufferSource(), g=c.createGain();
    s.buffer=b;
    if(rate) s.playbackRate.value=rate;
    g.gain.value=(vol===undefined?0.85:vol);
    s.connect(g); g.connect(AU.sfxGain);
    s.start();
    return true;
  }catch(e){ return false; }
}

function loadTrack(mode){
  if(MUSIC_BUF[mode]||MUSIC_LOADING[mode]) return;
  if(typeof fetch!=='function'||!AU.ctx) return;
  var url=MUSIC_FILE[mode]; if(!url) return;
  MUSIC_LOADING[mode]=true;
  fetch(url)
    .then(function(r){ if(!r.ok) throw new Error('http '+r.status); return r.arrayBuffer(); })
    .then(function(ab){
      return new Promise(function(res,rej){
        try{ AU.ctx.decodeAudioData(ab,res,rej); }catch(e){ rej(e); }
      });
    })
    .then(function(buf){
      MUSIC_BUF[mode]=buf; MUSIC_LOADING[mode]=false;
      if(AU.mode===mode&&AU.ctx){ stopSynth(); playTrack(mode); }
    })
    .catch(function(){ MUSIC_LOADING[mode]=false; });
}
function playTrack(mode){
  var buf=MUSIC_BUF[mode]; if(!buf||!AU.ctx) return;
  if(curTrack===mode&&musicSrc) return;
  stopTrack(true);
  var c=AU.ctx;
  musicGain=c.createGain();
  try{
    musicGain.gain.setValueAtTime(0.0001,c.currentTime);
    musicGain.gain.exponentialRampToValueAtTime(0.8,c.currentTime+1.4);
  }catch(e){ musicGain.gain.value=0.8; }
  musicGain.connect(AU.bgmGain);
  musicSrc=c.createBufferSource();
  musicSrc.buffer=buf; musicSrc.loop=true;
  musicSrc.connect(musicGain);
  try{ musicSrc.start(); }catch(e){}
  curTrack=mode;
}
function stopTrack(fade){
  var s=musicSrc, g=musicGain;
  if(!s) return;
  musicSrc=null; musicGain=null; curTrack=null;
  var c=AU.ctx;
  try{
    if(fade&&g&&c){
      var now=c.currentTime;
      g.gain.cancelScheduledValues(now);
      g.gain.setValueAtTime(Math.max(0.0001,g.gain.value||0.0001),now);
      g.gain.exponentialRampToValueAtTime(0.0001,now+0.5);
      setTimeout(function(){ try{ s.stop(); }catch(e){} try{ g.disconnect(); }catch(e){} },580);
    } else {
      s.stop(); g.disconnect();
    }
  }catch(e){}
}
function startSynth(mode){
  if(!AU.ctx) return;
  if(AU.timer){ clearInterval(AU.timer); AU.timer=null; }
  AU.step=0; AU.nextT=AU.ctx.currentTime+0.1;
  if(typeof setInterval==='function') AU.timer=setInterval(auTick,110);
}
function stopSynth(){ if(AU.timer){ clearInterval(AU.timer); AU.timer=null; } }
function preloadMusic(){
  ['day','night','dusk','title'].forEach(function(m){ loadTrack(m); });
  ['click','coin','hit','hurt','kill','error','upgrade','build','win','save'].forEach(function(n){ loadSfx(n); });
}
function auBgm(mode){
  AU.mode=mode||'off';
  if(!AU.ctx||AU.mode==='off'){ stopSynth(); stopTrack(true); return; }
  var file=MUSIC_FILE[AU.mode];
  if(file){
    if(MUSIC_BUF[AU.mode]){ stopSynth(); playTrack(AU.mode); }
    else { startSynth(AU.mode); loadTrack(AU.mode); }
  } else {
    stopTrack(true);
    startSynth(AU.mode);
  }
}
function auTick(){
  var c=AU.ctx; if(!c||c.state==='suspended') return;
  var p=AU_PAT[AU.mode]; if(!p) return;
  var spb=60/p.bpm/4;
  var guard=0;
  while(AU.nextT < c.currentTime+0.6 && guard++<48){
    var st=AU.step, t=AU.nextT;
    var bar=Math.floor(st/16);
    var ch=CHORDS[PROG[Math.floor(bar/2)%4]];
    var inBar=st%16;

    // 铺底和声（每 2 小节换一次）
    if(st%32===0){
      for(var v=0;v<ch.length;v++){
        auVoice({f:mf(ch[v]-12),type:'triangle',dur:spb*30,vol:0.024,voices:3,spread:11,
          attack:0.6,cutoff:1500,rev:p.rev,when:t});
      }
    }
    // 低音
    if(p.bass && inBar%4===0){
      auVoice({f:mf(ch[0]-24),type:'sawtooth',dur:spb*3.4,vol:0.10,
        cutoff:AU.mode==='night'?300:420,rev:0.08,when:t});
    }
    // 琶音
    if(p.arpEvery && inBar%p.arpEvery===0){
      var idx=(st/(p.arpEvery||1))|0;
      var note=ch[p.arpNotes[idx%p.arpNotes.length]];
      auVoice({f:mf(note+12),type:'square',dur:spb*(p.arpEvery>4?2.4:1.5),
        vol:AU.mode==='night'?0.028:0.036,cutoff:AU.mode==='night'?1600:2600,
        rev:p.rev*0.7,when:t});
    }
    // 标题页的稀疏拨弦
    if(p.pluck && st%16===8){
      auVoice({f:mf(ch[2]+24),type:'triangle',dur:spb*5,vol:0.05,rev:0.8,when:t});
    }
    // 鼓
    if(p.drums===2){
      if(inBar===0||inBar===8) auKick(t,0.4);
      if(inBar===4||inBar===12) auSnare(t,0.15);
      if(inBar%2===1) auHat(t,0.05);
    } else if(p.drums===1){
      if(inBar===0) auKick(t,0.34);
      if(inBar===8) auHat(t,0.05);
      if(inBar===12) auHat(t,0.04);
    }
    AU.step++; AU.nextT+=spb;
  }
}

  var m='title';

function layout(){
  var w=window.innerWidth, h=window.innerHeight;
  var portrait = h>w;
  var W,H;
  if(portrait && !forceLandscape){
    H = w;
    W = Math.min(h, H*16/9);
    gameEl.classList.add('rotated');
    gameEl.style.width=Math.floor(W)+'px';
    gameEl.style.height=Math.floor(H)+'px';
    gameEl.style.setProperty('--s',(H/180)+'px');
  } else {
    W=w; H=W*9/16;
    if(H>h){H=h;W=H*16/9;}
    W=Math.floor(W); H=Math.floor(H);
    gameEl.classList.remove('rotated');
    gameEl.style.width=W+'px';
    gameEl.style.height=H+'px';
    gameEl.style.setProperty('--s',(H/180)+'px');
  }
  var rot=$('rotate');
  if(rot) rot.classList.remove('show');
  if(G) G.paused=false;
}

var forceLandscape=false;
function isPortrait(){ return window.innerHeight>window.innerWidth; }
function goLandscape(){
  var el=document.documentElement;
  var p=[];
  try{
    if(el.requestFullscreen) p.push(el.requestFullscreen());
    else if(el.webkitRequestFullscreen) p.push(el.webkitRequestFullscreen());
    else if(el.webkitRequestFullScreen) p.push(el.webkitRequestFullScreen());
  }catch(e){}
  var lock=function(){
    try{
      if(screen.orientation && screen.orientation.lock){
        var r=screen.orientation.lock('landscape');
        if(r && r.catch) r.catch(function(){});
      }
    }catch(e){}
  };
  if(p.length && p[0] && p[0].then){
    p[0].then(function(){ lock(); setTimeout(layout,150); setTimeout(layout,500); })
        .catch(function(){ lock(); setTimeout(layout,200); });
  } else {
    lock();
    setTimeout(layout,200);
  }
  forceLandscape=false;
  setTimeout(layout,300);
}

function recomputePower(){
  var used=0;
  slots.forEach(function(s){
    var st=s.st;
    if(!st) return;
    if(st.state!=='ok'){ st.off=false; return; }
    used+=CFG[st.kind].power;
  });
  G.powerUse=used;
  var over=used-G.powerCap;
  if(over>0){
    var list=slots.filter(function(s){return s.st&&s.st.state==='ok';}).sort(function(a,b){return b.st.born-a.st.born;});
    for(var i=0;i<list.length && over>0;i++){
      var st=list[i].st;
      var p=CFG[st.kind].power;
      if(p<=0) continue;
      st.off=true; over-=p;
    }
  } else {
    slots.forEach(function(s){ if(s.st) s.st.off=false; });
  }
  syncHUD();
}

  el=$('hPre'); if(el) el.textContent=Math.floor(G.prestige);

  var sb=$('skipBtn');
  if(sb) sb.style.visibility = (G.phase==='dusk')?'visible':'hidden';
  var btns=document.querySelectorAll('[data-sp]');

    var b=btns[i];

    b.classList.remove('off');

}

var menuOpen=false;
function openPanel(html){ panel.innerHTML=html; panelWrap.classList.add('show'); menuOpen=true; G.paused=true; }
function closePanel(){ panelWrap.classList.remove('show'); menuOpen=false; G.paused=false; }
function row(label, sub, right, dis, id){
  return '<div class="row'+(dis?' dis':'')+'" data-act="'+id+'"><div class="l"><span>'+label+'</span>'+(sub?'<span class="sub">'+sub+'</span>':'')+'</div><div class="r">'+(right||'')+'</div></div>';
}
function foot(){ return '<div class="foot"><button class="btn" data-act="close">关闭</button></div>'; }
panel.addEventListener('click',function(e){
  var t=e.target;
  while(t && t!==panel && !t.dataset.act) t=t.parentNode;
  if(!t || t===panel) return;
  var act=t.dataset.act;
  if(act==='close'){ closePanel(); return; }
  handleAct(act);
});

// 点击面板外部关闭（结算/结束面板除外）
(function(){
  var wrap=panelWrap;

    if(e.target!==wrap) return;

    closePanel();
  },{passive:true});
})();

function defUpCost(st){
  var base=Math.floor(DEFS[st.kind].cost*1.2*st.level);
  return Math.max(1,Math.floor(base*(hasNpc('zhou')?0.6:1)));
}
function defRepCost(st){
  var pct=clamp(st.hp/st.maxHp,0,1);
  return Math.max(0,Math.ceil((1-pct)*DEFS[st.kind].cost*0.6));
}

function handleAct(act){
  var p=act.split(':'), a=p[0], v=p[1];
  if(a==='vaultIn100'){ if(G.purse>=100){G.purse-=100;G.vault+=100;} closePanel(); homeMenu(); return; }
  if(a==='vaultOut100'){ if(G.vault>=100){G.vault-=100;G.purse+=100;} closePanel(); homeMenu(); return; }
  if(a==='vaultInAll'){ G.vault+=G.purse; G.purse=0; closePanel(); homeMenu(); return; }
  if(a==='vaultOutAll'){ G.purse+=G.vault; G.vault=0; closePanel(); homeMenu(); return; }
  if(a==='homeUp'){
    var need=LV[G.homeLevel], cost=HOME_UP_COST[G.homeLevel];
    if(G.homeLevel<8 && G.totalRevenue>=need.rev && G.prestige>=need.pres && G.purse>=cost){
      G.purse-=cost; G.homeLevel++; G.powerCap=LV[G.homeLevel-1].power; sfx('upgrade');
      G.homeMax=120+ (G.homeLevel-1)*40; G.homeHP=G.homeMax;
      prestige(6); recomputePower(); syncHUD();
    }
    closePanel(); homeMenu(); return;
  }
  if(a==='borrow'){ G.purse+=1000; G.loan+=1000; closePanel(); hardwareMenu(); return; }
  if(a==='repay'){
    if(G.loan>0&&G.purse>=G.loan){ G.purse-=Math.ceil(G.loan); G.loan=0; prestige(2); }
    closePanel(); hardwareMenu(); return;
  }
  if(a==='joinNpc'){ joinNpc(v); closePanel(); return; }
  if(a==='deploy'){ deployPanel(); return; }
  if(a==='side'){
    var fi=parseInt(v,10);
    if(G.fighters[fi]) G.fighters[fi].side=(p[2]||'auto');
    deployPanel(); return;
  }
  if(a==='hireStaffAt'){
    var stx=bySlot(parseInt(v,10));
    if(stx&&stx.state==='ok'&&stx.staff<stx.level&&G.purse>=100){
      G.purse-=100; stx.staff++; G.staff++; G.staffHired=(G.staffHired||0)+1;
      addParts(stx.x,GY-18,6,'#7ff0c4');
    }
    closePanel(); shopMenu(stx||{}); return;
  }
  if(a==='hireStaff'){ closePanel(); homeMenu(); return; }
  if(a==='hireMelee'||a==='hireRanged'||a==='hireRobot'){
    var type=a==='hireMelee'?'melee':(a==='hireRanged'?'ranged':'robot');
    var cfg=FIGHTERS[type];
    var ok = G.fighters.length<capFighters() && G.homeLevel>=cfg.lv && G.purse>=cfg.cost;
    if(type==='robot') ok = ok && countRobots()<robotCap();
    if(ok){ spend(cfg.cost); addFighter(type); }
    closePanel(); homeMenu(); return;
  }
  if(a==='order'){
    var kind=v, c=CFG[kind];
    if(!c){ closePanel(); hardwareMenu(); return; }   // 未知类型直接忽略
    if(c.day&&c.day>G.day){ closePanel(); hardwareMenu(); return; }
    var dis = G.purse<c.cost || (isShop(kind)?countShops()>=capShops():countDefs()>=capDefs());
    if(!dis){ G.purse-=c.cost; G.order={kind:kind,cost:c.cost}; syncHUD(); }
    closePanel(); hardwareMenu(); return;
  }
  if(a==='cancelOrder'){ if(G.order){ G.purse+=G.order.cost; G.order=null; syncHUD(); } closePanel(); hardwareMenu(); return; }
  if(a==='restock'){ var st=bySlot(+v); if(st){ st.restockT=CFG[st.kind].restock; } closePanel(); return; }
  if(a==='upgrade'){
    var st2=bySlot(+v);
    if(st2&&st2.level<3){
      var cc=Math.floor(CFG[st2.kind].cost*2*st2.level);
      if(spend(cc)){ st2.level++; st2.maxStock=Math.floor(CFG[st2.kind].stock*(1+0.25*(st2.level-1))); st2.hp=st2.maxHp; prestige(8); }
    }
    closePanel(); if(st2)shopMenu(st2); return;
  }
  if(a==='defRepair'){
    var s8=bySlot(+v);
    if(s8&&s8.state==='ok'){
      var rc=defRepCost(s8);
      if(rc>0&&spend(rc)){ s8.hp=s8.maxHp; sfx('build'); addParts(s8.x,GY-18,6,'#7ff0c4'); }
    }
    closePanel(); if(s8)defMenu(s8); return;
  }
  if(a==='defUpgrade'){
    var s9=bySlot(+v);
    if(s9&&s9.state==='ok'&&s9.level<3){
      var uc2=defUpCost(s9);
      if(spend(uc2)){
        s9.level++; s9.maxHp=Math.round(s9.maxHp*1.4); s9.hp=s9.maxHp;
        prestige(6); sfx('upgrade'); addParts(s9.x,GY-24,8,'#7ff0c4');
      }
    }
    closePanel(); if(s9)defMenu(s9); return;
  }
  if(a==='demolish'){
    var st3=bySlot(+v);
    if(st3){
      var sl=st3.slot;
      G.purse+=Math.floor(CFG[st3.kind].cost*0.5*(st3.state==='ruin'?0.3:1));
      if(isShop(st3.kind)&&st3.staff>0){ G.staff=Math.max(0,G.staff-st3.staff); }
      slots[sl].st=null; recomputePower(); syncHUD();
    }
    closePanel(); return;
  }
  if(a==='raze'){ var st4=bySlot(+v); if(st4){ slots[st4.slot].st=null; recomputePower(); } closePanel(); return; }
  if(a==='sellDrops'){ G.purse+=G.drops*25; addParts(G.player.x,GY-20,8,'#b79bff'); G.drops=0; syncHUD(); closePanel(); return; }
  if(a==='zhouTalk'){ zhouDialog(); return; }
  if(a==='help'){ helpPanel(); return; }
  if(a==='story'){ storyPanel(); return; }
  if(a==='storyPanel'){ storyPanel(); return; }
  if(a==='storyRead'){ storyRead(v); return; }
  if(a==='npcList'){ npcPanel(); return; }
  if(a==='pact'){ doPact(v); return; }
  if(a==='endingA'){ endingA(); return; }
  if(a==='endingBack'){ closePanel(); return; }
  if(a==='skipTut'){ tutActive=false; lastObj=''; closePanel(); syncObjective(); return; }
  if(a==='settleGo'){ closePanel(); newDay(); return; }
  if(a==='restart'){ closePanel(); reset(); G.started=true; return; }
  if(a==='startGame'){
    closePanel();
    G.started=true;
    auInit(); auResume(); auPhaseBgm(); sfx('click');
    try{ goLandscape(); }catch(e){}
    return;
  }
  if(a==='saveNow'){ closePanel(); manualSave(); return; }
  if(a==='mainMenu'){ mainMenu(); return; }
  if(a==='loadPanel'){ loadPanel(); return; }
  if(a==='loadSlot'){
    var li=parseInt(v,10);
    if(readSlot(li)){ loadGame(li); showToast('已载入存档 '+(li+1),'#7ff0c4'); }
    return;
  }
  if(a==='toggleBgm'){ auSetBgm(!AU.bgm); mainMenu(); return; }
  if(a==='toggleSfx'){ auSetSfx(!AU.sfx); sfx('click'); mainMenu(); return; }
  if(a==='toTitle'){
    closePanel();
    if(curSlot!==null&&curSlot!==undefined&&G.started&&!G.over) writeSlot(curSlot);
    G.started=false; G.paused=false; G.userPaused=false;
    auBgm('off');
    showTitle();
    return;
  }
}

function bySlot(i){ return slots[i]?slots[i].st:null; }

function assignStaff(){
  var best=null;
  for(var i=0;i<slots.length;i++){
    var s=slots[i];
    if(s.st && isShop(s.st.kind) && s.st.kind!=='pawn' && s.st.state==='ok' && s.st.staff<s.st.level){
      if(!best || s.st.staff<best.st.staff) best=s;
    }
  }
  if(best) best.st.staff++;
}

function addFighter(type){
  var c=FIGHTERS[type];
  var bonus=0, pa=null;
  slots.forEach(function(s){ if(s.st&&s.st.kind==='pawn'&&s.st.state==='ok') pa=s.st; });
  if(pa) bonus=pa.level*0.1;
  var md=hasShopKind('med');
  if(md) bonus+=md.level*0.1;
  var hp=Math.floor(c.hp*(1+bonus));
  G.fighters.push({type:type, x:rr(-10,10), hp:hp, maxHp:hp, cd:0, t:rr(0,1), dmg:c.dmg, rate:c.rate, range:c.range, speed:c.speed, target:null, face:1, side:'auto', homeOff:rr(-24,24), patrolT:0});
}

function hasNpc(id){
  if(id==='zhou') return !!G.zhouJoined;
  return !!(G.joined&&G.joined[id]);
}
function joinedCount(){
  var n=(G.zhouJoined?1:0);
  for(var k in G.joined) if(G.joined[k]) n++;
  return n;
}
function hasShopKind(kind,lv){

function npcMet(n){
  if(n.id==='zhou') return false;
  if(n.day&&G.day<n.day) return false;
  if(n.kills&&G.kills<n.kills) return false;
  if(n.rev&&G.totalRevenue<n.rev) return false;
  if(n.lv&&G.homeLevel<n.lv) return false;
  if(n.npc&&joinedCount()<n.npc) return false;
  if(n.pawnLv&&!hasShopKind('pawn',n.pawnLv)) return false;
  if(n.need&&!hasShopKind(n.need,n.needLv)) return false;

var NPC_SPOT=[-22,24,-90,92,-154,156,-218,220];
function checkNpcSpawns(){

  for(var i=0;i<NPCS.length;i++){

    for(var j=0;j<G.street.length;j++) if(G.street[j].id===n.id) on=true;

function npcTaskDone(n){

  if(n.id==='chen') return G.kills>=60;
  if(n.id==='mei') return G.loan<=0&&G.vault>=30000;
  if(n.id==='ni') return G.totalRevenue>=20000;
  if(n.id==='yu') return (G.day-(G.npcDay[n.id]||G.day))>=4;

  if(n.id==='mei') return '存款 '+Math.floor(G.vault)+'/30000 · 贷款 '+Math.floor(G.loan);
  if(n.id==='ni') return Math.floor(G.totalRevenue)+'/20000';
  if(n.id==='yu') return '已过 '+(G.day-(G.npcDay[n.id]||G.day))+'/4 天';

function drawCenterDoor(){
  var d=doorState();
  if(d===0) return;
  var x=DOOR_X;
  // 地面开口
  R(x-16,GY-2,32,3,'#070b12');
  R(x-15,GY-2,30,1,'#3a4d6e');
  // 向下三级台阶
  R(x-12,GY+1,24,2,'#2a3852');
  R(x-12,GY+1,24,1,'#46608a');
  R(x-9,GY+3,18,2,'#243149');
  R(x-9,GY+3,18,1,'#3a4d6e');
  R(x-6,GY+5,12,2,'#1c2739');
  R(x-6,GY+5,12,1,'#31456a');
  // 门洞 + 门框
  var gx=x-13, gy=GY+7, gw=26, gh=23;
  R(gx-3,gy-3,gw+6,gh+6,'#04060c');
  R(gx-2,gy-2,gw+4,gh+4,d===4?'#101827':'#3a4d6e');
  R(gx-1,gy-1,gw+2,gh+2,d===4?'#0b111b':'#243149');
  R(gx,gy,gw,gh,d===4?'#080b11':'#26324a');
  var mid=gx+Math.floor(gw/2);
  // 两扇门板（比门框亮，能看出是门）
  R(gx+1,gy+1,mid-gx-2,gh-2,d===4?'#0b1018':'#33425c');
  R(mid+1,gy+1,gx+gw-mid-2,gh-2,d===4?'#0b1018':'#2c3a52');
  // 横向加强条
  for(var r=0;r<3;r++){
    var ry=gy+5+r*6;
    R(gx+2,ry,mid-gx-3,1,d===4?'#111827':'#4a6288');
    R(mid+2,ry,gx+gw-mid-3,1,d===4?'#111827':'#41587a');
  }
  // 竖向纹理
  R(gx+4,gy+2,1,gh-4,d===4?'#0e1420':'#3d5070');
  R(gx+gw-5,gy+2,1,gh-4,d===4?'#0e1420':'#37496a');
  // 中缝
  R(mid-1,gy+1,2,gh-2,d===4?'#0b1119':(d>=2?'#2a6a7a':'#121a28'));
  if(d===3){
    R(mid-1,gy+2,2,gh-4,'#7bfff0');
    A(mid-1,gy+3,2,gh-6,'#ffffff',0.55);
    glow(x,gy+Math.floor(gh/2),15,'#3ee9ff',0.24);
  } else if(d===2){
    A(mid-1,gy+3,2,gh-6,'#7bfff0',0.30);
    glow(x,gy+Math.floor(gh/2),10,'#3ee9ff',0.10);
  }
  // 把手
  if(d!==4){
    R(mid-3,gy+Math.floor(gh/2),2,3,'#a8b8cc');
    R(mid+1,gy+Math.floor(gh/2),2,3,'#a8b8cc');
  }
  // 顶部灯罩 + 指示灯
  var lit = d===3? (Math.sin(G.tick*4)>-0.2) : (d===2?(Math.sin(G.tick*2)>0.4):false);
  var lc = d===3?'#7ff0c4':(d===2?'#ffc857':'#3a2430');
  R(x-5,gy-5,10,3,'#0a0f18');
  R(x-4,gy-4,3,1,lit?lc:'#20303f');
  R(x+1,gy-4,3,1,lit?lc:'#20303f');
  if(lit) glow(x,gy-4,11,lc,0.20);
  // 底部警示条
  R(gx,gy+gh-3,gw,3,d===4?'#0c1119':'#2a2014');
  for(var w=0;w<6;w++) A(gx+2+w*4,gy+gh-3,2,3,d===4?'#121927':'#c9a24a',0.9);
}

function npcState(n){
  if(hasNpc(n.id)) return '已入队';
  if(n.id==='zhou'){
    if(!G.zhou && G.day<4) return '未出现';
    if(countDefs()>=3) return '可入队';
    return '在街上';
  }
  var on=false, arr=G.street||[];
  for(var i=0;i<arr.length;i++) if(arr[i].id===n.id) on=true;
  if(on) return npcTaskDone(n)?'可入队':'在街上';
  return npcMet(n)?'在路上':'未出现';
}
function kfmt(v){ return v>=1000?(Math.floor(v/100)/10)+'k':(''+Math.floor(v)); }
function npcFront(n){
  if(n.day && G.day<n.day) return '第 '+n.day+' 天';
  if(n.lv && G.homeLevel<n.lv) return '家 Lv'+n.lv;
  if(n.npc && joinedCount()<n.npc) return '先入队 '+n.npc+' 人';
  if(n.pawnLv && !hasShopKind('pawn',n.pawnLv)) return '需当铺 Lv'+n.pawnLv;
  if(n.need && !hasShopKind(n.need,n.needLv)) return '需'+SHOPS[n.need].name+' Lv'+(n.needLv||1);

var lastNpcChip='';

  var el=$('npcChip'); if(!el) return;

    n=NPCS[i];
    if(hasNpc(n.id)) continue;

    pick=rest[idx]; txt=npcChipText(pick.n,pick.st);
    if(pick.st==='在街上') cls+=' near';
  } else {
    cls+=' ready';

    atkCd:0, angle:-Math.PI/2, dmgTaken:0
  };
  slot.st=st;
  G.order=null;
  if(isDef(kind)) G.defsBuilt++;
  addParts(slot.x, GY-6, 6, '#8fd3ff');
  syncHUD();
}

// ============================== 玩家 ==============================
var keys={left:false,right:false};
function updatePlayer(dt){  var p=G.player;
  var dir=0;
  if(keys.left) dir-=1;
  if(keys.right) dir+=1;
  var sp=62;
  if(dir!==0){ p.vx=dir*sp; p.face=dir; p.walk+=dt*7; G.moved+=Math.abs(p.vx)*dt; }
  else { p.vx*=Math.pow(0.001,dt); p.walk=0; }
  p.x+=p.vx*dt;
  p.x=clamp(p.x,-560,560);
  if(p.inv>0) p.inv-=dt;
  G.camX=clamp(p.x,-520,520);
}

function nearestInteract(){
  var p=G.player, best=null, bd=1e9;
  function cand(x,obj,r){ var d=Math.abs(p.x-x); if(d<(r||22) && d<bd){ bd=d; best=obj; } }
  cand(0,{t:'home'},30);
  cand(-52,{t:'hardware'},26);
  if(G.zhou && !G.zhouJoined) cand(-36,{t:'zhou'},18);
  if(G.street) for(var n1=0;n1<G.street.length;n1++) cand(G.street[n1].x,{t:'npc',npc:G.street[n1]},16);
  if(xiaoAlive()) cand(G.xiao.x,{t:'xiao'},16);
  if(doorState()>0) cand(DOOR_X,{t:'door'},16);
  for(var i=0;i<slots.length;i++){
    var s=slots[i];
    if(s.st) cand(s.x,{t:(isShop(s.st.kind)?'shop':'def'),st:s.st},20);
    else if(G.order) cand(s.x,{t:'slot',slot:s},18);
  }
  return best;
}

function doInteract(){
  if(menuOpen) return;
  var it=nearestInteract();
  if(!it) return;
  if(it.t==='zhou'){ zhouDialog(); return; }
  if(it.t==='npc'){ npcDialogOnStreet(it.npc); return; }
  if(it.t==='xiao'){ xiaoDialog(); return; }
  if(it.t==='door'){ centerDoorDialog(); return; }
  if(it.t==='home'){ homeMenu(); return; }
  if(it.t==='hardware'){ hardwareMenu(); return; }
  if(it.t==='shop'){ shopMenu(it.st); return; }
  if(it.t==='def'){ defMenu(it.st); return; }
  if(it.t==='slot'){ placeOrder(it.slot); return; }
}

// ============================== 商店/顾客 ==============================
function updateShops(dt){
  for(var i=0;i<slots.length;i++){
    var st=slots[i].st;
    if(!st) continue;
    if(st.state==='building'){
      st.buildT-=dt;
      if(st.buildT<=0){ st.state='ok'; recomputePower(); addParts(st.x,GY-10,10,'#7ff0c4'); sfx('build'); }
      continue;
    }
    if(st.state!=='ok') continue;
    if(st.restockT>0){
      st.restockT-=dt;
      if(st.restockT<=0){ st.stock=st.maxStock; }
      continue;
    }
    if(hasNpc('yu')&&isShop(st.kind)&&!SHOPS[st.kind].noIncome) st.stock=st.maxStock;
    if(!isShop(st.kind)) continue;
    var c=SHOPS[st.kind];
    if(c.noIncome) continue;
    if(G.phase==='night'&&!c.night) continue;
    if(st.off) continue;
    if(!c.noStock&&st.stock<=0) continue;
    st.incomeT-=dt;
    if(st.incomeT<=0){
      var mult=(1+0.35*st.staff)*(1+G.prestige/500)*(hasNpc('man')?1.5:1);
      var price=Math.floor(c.price*mult);
      st.stock--;
      G.dayRevenue+=price; G.totalRevenue+=price;
      st.pending=(st.pending||0)+price;
      st.incomeT = c.custT/(1+0.35*st.staff);
      if(st.stock<=0) addParts(st.x,GY-16,4,'#ff6b6b');
    }
  }
}

function updateCoins(dt){
  var p=G.player;
  for(var i=0;i<slots.length;i++){
    var st=slots[i].st;
    if(!st||!st.pending||st.state!=='ok') continue;
    if(Math.abs(st.x-p.x)<34){
      var take=Math.round(st.pending);
      st.pending=0;
      if(take>0){
        earn(take);
        G.collected++;
        G.cashPop=(G.cashPop||0)+1;
        addParts(st.x,GY-16,5,'#ffd86b');
        if(!G._coinT||G.tick-G._coinT>0.22){ G._coinT=G.tick; sfx('coin'); }
      }
    }
  }
}

// ============================== 夜晚 ==============================
function waveCount(){ return clamp(2+Math.floor(G.day/2)+(hasNpc('man')?1:0),2,9); }
function startNight(){
  G.phase='night'; G.t=NIGHT_LEN; G.speed=1;
  sfx('alert'); auPhaseBgm();
  G.wavesLeft=waveCount(); G.waveTimer=10; G.nightDestroyed=0;
  if(!G.plan||!G.plan.length) G.plan=planNight();
  G.intel=G.plan[0];
  syncHUD();
}
function onDuskEnter(){
  G.plan=planNight();
  G.intel=G.plan[0];
  if(G.fighters.length>0) deployPanel();
}
function typeNames(arr){
  var m={},out=[];
  for(var i=0;i<arr.length;i++) m[arr[i]]=(m[arr[i]]||0)+1;
  for(var k in m){
    var e2=ENEMY[k]||{};
    var hp=Math.floor((e2.hp||0)*(1+G.day*0.03));
    out.push((e2.name||k)+(m[k]>1?'×'+m[k]:'')+' '+hp+'血');
  }
  return out.join(' · ');
}
function sideBtn(i,sd,label,cur){
  var on=cur===sd;
  return '<button class="btn" style="padding:2px 7px;font-size:.92em;'+(on?'background:#2f6bd8;border-color:#5f9cff;color:#fff':'')+'" data-act="side:'+i+':'+sd+'">'+label+'</button>';
}
function deployPanel(){
  var it=G.intel||{};
  G.deployOpened=true;
  var h='<h3>'+(G.phase==='dusk'?'黄昏 · 布防':'布防 · 调度')+'</h3>';
  var plan=G.plan||[];
  if(it.count){
    var rightN=0,leftN=0;
    for(var wi=0;wi<plan.length;wi++){ if(plan[wi].side<0) leftN+=plan[wi].count; else rightN+=plan[wi].count; }
    h+='<div class="txt">今晚 <b>'+plan.length+'</b> 波 · 共 <b>'+rightN+'+'+leftN+'</b> 名（右+左）<br>'+
       '<span style="color:#ff9f6b">第 1 波 从'+(it.side<0?'左':'右')+'边来</span> · '+it.count+' 名 · '+
       '<span style="color:#8fd3ff">'+typeNames(it.types)+'</span></div>';
    // 后续波次（只有方向与人数，阵容到点才知道）
    var rest=[];
    for(var w2=1;w2<plan.length;w2++){
      rest.push('<span style="color:'+(plan[w2].side<0?'#ffd86b':'#7ff0c4')+'">第 '+(w2+1)+' 波 从'+(plan[w2].side<0?'左':'右')+' · '+plan[w2].count+' 名</span>');
    }
    if(rest.length){
      h+='<div class="txt" style="color:#7f8da8">'+rest.join('<br>')+'<br><span style="color:#5c6b85">（方向与人数会变，阵容进场才知道）</span></div>';
    }
  } else {
    h+='<div class="txt" style="color:#7f8da8">白天没有情报 · 黄昏时会刷新第一波的方位与阵容。</div>';
  }
  if(!G.fighters.length){
    h+='<div class="txt" style="color:#7f8da8">还没有战斗人员。先回家招募再布防。</div>';
  } else {
    h+='<div class="txt" style="color:#7f8da8">选择每人今晚守哪一侧（自动 = 跟着敌人方向跑）。远程会站在近战与机器人身后。</div>';
    for(var i=0;i<G.fighters.length;i++){
      var f=G.fighters[i], cfg=FIGHTERS[f.type];
      var sd=f.side||'auto';
      h+='<div class="row" style="flex-wrap:wrap;gap:6px;padding:5px 8px">'+
         '<div class="l"><span>'+cfg.name+' #'+(i+1)+'</span>'+
         '<span class="sub">HP '+Math.ceil(f.hp)+'/'+f.maxHp+' · '+(sd==='left'?'守左':(sd==='right'?'守右':'自动'))+'</span></div>'+
         '<div class="r" style="display:flex;gap:4px">'+
           sideBtn(i,'left','左',sd)+sideBtn(i,'auto','自动',sd)+sideBtn(i,'right','右',sd)+
         '</div></div>';
    }
  }
  h+=foot();
  openPanel(h);
}
function pickEnemyType(){
  var pool=[],k;
  for(k in ENEMY){ if(ENEMY[k].day<=G.day) pool.push(k); }
  var t=pool[Math.floor(Math.random()*pool.length)]||'thief';
  if(t==='captain'&&Math.random()>0.4) t='gang';
  if(t==='cyborg'&&Math.random()>0.6) t='gang';
  return t;
}
function planWaveAt(idx){
  var count=2+Math.floor(G.day/3);
  // 第一晚只从右边来；第二天起左右交替（第 1 波右、第 2 波左…）
  var side=(G.day<=1)?1:((idx%2===0)?1:-1);
  var types=[];
  for(var i=0;i<count;i++) types.push(pickEnemyType());
  return {side:side,count:count,types:types};
}
function planWave(){
  return planWaveAt(0);
}
// 预演整晚：第一晚全从右边；之后第 1 波右、第 2 波左……交替
function planNight(){
  var total=waveCount(), out=[];
  for(var i=0;i<total;i++) out.push(planWaveAt(i));
  return out;
}
function spawnWave(){
  var total=(G.plan&&G.plan.length)?G.plan.length:0;
  var idx=total?Math.max(0,Math.min(total-1,total-G.wavesLeft)):0;
  var plan=(G.plan&&G.plan[idx])?G.plan[idx]:planWave();
  var count=plan.count;
  var side=plan.side;
  var maxX=slots[slots.length-1].x+30;
  for(var i=0;i<count;i++){
    var type=plan.types[i]||'thief';
    var ec=ENEMY[type];
    var hp=Math.floor(ec.hp*(1+G.day*0.03));
    G.enemies.push({
      type:type, x:side*(maxX+i*16), hp:hp, maxHp:hp,
      dmg:ec.dmg, speed:ec.speed, drop:ec.drop,
      cd:0, hitCd:0, face:-side, target:null, stealT:0, boss:!!ec.boss
    });
  }
  G.wavesLeft--;
  G.waveTimer=G.waveGap;
}

function updateEnemies(dt){
  var p=G.player;
  for(var i=G.enemies.length-1;i>=0;i--){
    var e=G.enemies[i];
    if(e.hp<=0){
      G.kills++; G.drops+=((ENEMY[e.type]||{}).drop||1);
      sfx('kill');
      if(e.boss) prestige(2);
      addParts(e.x,GY-8,e.boss?14:6,'#ff5a4a');
      G.enemies.splice(i,1); continue;
    }
    var dir = e.x>0?-1:1;
    e.face=dir;
    // 贴身保安：停下对打，不再绕过去砸店
    var blk=null, bdist=1e9;
    for(var fi=0;fi<G.fighters.length;fi++){
      var ff=G.fighters[fi];
      var df=Math.abs(ff.x-e.x);
      if(df<9&&df<bdist){ bdist=df; blk=ff; }
    }
    if(blk){
      e.face=blk.x>e.x?1:-1;
      e.cd-=dt;
      if(e.cd<=0){
        e.cd=0.9;
        blk.hp-=e.dmg*0.55;
        addParts(blk.x+(blk.x>e.x?5:-5),GY-16,3,'#ff8f5a');
        addDmgNum(blk.x,GY-30,e.dmg*0.55,'#ff8f6a');
      }
      continue;
    }
    var tgt=null, bestd=1e9;
    for(var j=0;j<slots.length;j++){
      var s=slots[j]; var st=s.st;
      if(!st) continue;
      if(st.state==='ruin') continue;
      var d=st.x-e.x;
      if(d*dir>0 && Math.abs(d)<bestd){ bestd=Math.abs(d); tgt=st; }
    }
    if(tgt && Math.abs(tgt.x-e.x)<13){
      e.cd-=dt;
      if(e.cd<=0){
        e.cd=0.8;
        tgt.hp-=e.dmg;
        addParts(tgt.x+rr(-6,6),GY-14,2,'#ffb86e');
        if(!G._smashT||G.tick-G._smashT>0.25){ G._smashT=G.tick; auNoise(0.09,0.13,520,undefined,'lowpass',AU.sfxGain); }
        if(tgt.hp<=0){
          tgt.state='ruin'; tgt.hp=0;
          if(isShop(tgt.kind)&&tgt.staff>0&&!hasNpc('yu')) G.staff=Math.max(0,G.staff-tgt.staff);
          G.nightDestroyed++; G.destroyedNight++;
          prestige(-12);
          recomputePower();
        }
      }
    } else {
      e.x+=dir*e.speed*dt;
    }
    if(Math.abs(e.x)<34){
      e.cd-=dt;
      if(e.cd<=0){
        e.cd=1.0;
        G.homeHP-=e.dmg*2;
        addParts(0+rr(-8,8),GY-20,3,'#ff6b6b');
        if(G.homeHP<=0){ destroyHome(); return; }
      }
    }
    if(Math.abs(e.x-p.x)<10 && p.inv<=0){
      p.inv=2.2;
      var loss=Math.floor(G.purse*0.15);
      G.purse-=loss; if(loss>0) addParts(p.x,GY-12,6,'#ff6b6b');
      prestige(-3);
      sfx('hurt');
      G.flash=0.25;
      p.x+=(p.x>=e.x?16:-16);
    }
  }
}

function destroyHome(){
  G.homeHP=0;
  G.vault=Math.floor(G.vault*0.6);
  prestige(-40);
  if(G.homeLevel>1){ G.homeLevel--; G.powerCap=LV[G.homeLevel-1].power; G.homeMax=120+(G.homeLevel-1)*40; }
  G.homeHP=Math.floor(G.homeMax*0.5);
  G.longDay=true;
  G.flash=0.6;
  G.enemies.length=0;
  endNight(true);
}

// ============================== 保安 ==============================
function streetBounds(){
  var lo=1e9, hi=-1e9, any=false;
  for(var i=0;i<slots.length;i++){
    var st=slots[i].st;
    if(!st||st.state==='ruin'||st.state==='building') continue;
    any=true;
    if(st.x<lo) lo=st.x;
    if(st.x>hi) hi=st.x;
  }
  if(!any){ lo=-50; hi=50; }
  // 至少覆盖家两侧一段，保证有活动空间
  if(lo>-110) lo=-110;
  if(hi<110) hi=110;
  return {lo:lo,hi:hi};
}
function enemyDir(){
  if(!G.enemies||!G.enemies.length) return 0;
  var s=0;
  for(var i=0;i<G.enemies.length;i++) s+=G.enemies[i].x;
  return s>0?1:-1;
}
// 每帧重排站位：同侧的人左右错开，近战/机器人靠外、远程靠内
function assignFighterSpots(b){
  var d=enemyDir();
  var left=[], right=[];
  for(var i=0;i<G.fighters.length;i++){
    var f=G.fighters[i];
    var side=f.side||'auto';
    if(side==='auto') side=(G.phase==='night'&&d)?(d<0?'left':'right'):((f.homeOff||0)<0?'left':'right');
    f._side=side;
    (side==='left'?left:right).push(f);
  }
  function rank(f){ return (f.type==='melee'||f.type==='robot')?0:1; }
  left.sort(function(a,c){ return rank(a)-rank(c); });
  right.sort(function(a,c){ return rank(a)-rank(c); });
  var gap=15;
  for(var l=0;l<left.length;l++) left[l]._anchor=b.lo+8+l*gap;
  for(var r=0;r<right.length;r++) right[r]._anchor=b.hi-8-r*gap;
}
function patrolRange(f,b){
  if(G.phase==='night') return {lo:Math.max(b.lo,f._anchor-16),hi:Math.min(b.hi,f._anchor+16)};
  if(f._side==='left') return {lo:b.lo+4,hi:Math.max(b.lo+40,Math.min(0,b.hi-4))};
  return {lo:Math.min(b.hi-40,Math.max(0,b.lo+4)),hi:b.hi-4};
}
function updateFighters(dt){
  var b=streetBounds();
  assignFighterSpots(b);
  for(var i=G.fighters.length-1;i>=0;i--){
    var f=G.fighters[i];
    if(f.hp<=0){
      addParts(f.x,GY-10,8,'#ff6b6b'); prestige(-2);
      G.fighters.splice(i,1); continue;
    }
    var cfg=FIGHTERS[f.type];
    var target=null, bd=1e9;
    for(var j=0;j<G.enemies.length;j++){
      var e=G.enemies[j];
      var d=Math.abs(e.x-f.x);
      if(d<bd){ bd=d; target=e; }
    }
    f.target=target;
    var anchor=f._anchor;
    var engaged = target && bd<cfg.range+45;
    if(engaged){
      var dir=target.x>f.x?1:-1;
      f.face=dir;
      if(f.type==='melee'){
        if(bd>cfg.range){ f.x+=dir*cfg.speed*dt; }
        else {
          f.cd-=dt;
          if(f.cd<=0){
            f.cd=cfg.rate;
            var md1=cfg.dmg*dmgMul('melee');
            target.hp-=md1;
            addParts(target.x,GY-12,2,'#ffd86b');
            addDmgNum(target.x,GY-26,md1,'#ffe08a');
            if(!G._hitT||G.tick-G._hitT>0.085){ G._hitT=G.tick; sfx('hit'); }
          }
        }
      } else if(f.type==='robot'){
        if(bd>cfg.range*0.8){ f.x+=dir*cfg.speed*dt; }
        f.cd-=dt;
        if(f.cd<=0 && bd<=cfg.range){
          f.cd=cfg.rate;
          G.projs.push({x:f.x+dir*5, y:GY-20, vx:dir*300, dmg:cfg.dmg*dmgMul('robot'), life:1.2, from:'f'});
        }
      } else {
        // 远程：拉开距离，保持在自己的射程内侧
        var want=clamp(target.x-dir*Math.min(cfg.range*0.82,88), b.lo, b.hi);
        var dd=want-f.x;
        if(Math.abs(dd)>5) f.x+=Math.sign(dd)*cfg.speed*dt;
        f.cd-=dt;
        if(f.cd<=0 && bd<=cfg.range){
          f.cd=cfg.rate;
          G.projs.push({x:f.x+dir*4, y:GY-17, vx:dir*280, dmg:cfg.dmg*dmgMul(f.type), life:1.2, from:'f'});
        }
      }
    } else {
      // 巡逻 / 回位
      f.patrolT=(f.patrolT||0)-dt;
      if(f.patrolT<=0){
        f.patrolT=rr(2.6,5.2);
        var pr=patrolRange(f,b);
        f.patrolX=rr(pr.lo,pr.hi);
      }
      var goal=(G.phase==='night')?anchor:(f.patrolX===undefined?anchor:f.patrolX);
      var dx2=goal-f.x;
      if(Math.abs(dx2)>3){
        f.x+=Math.sign(dx2)*cfg.speed*0.7*dt;
        f.face=Math.sign(dx2);
        f.moving=1;
      } else f.moving=0;
    }
    f.x=clamp(f.x,b.lo,b.hi);
  }
}

function updateTurrets(dt){
  for(var i=0;i<slots.length;i++){
    var st=slots[i].st;
    if(!st||st.state!=='ok'||st.kind!=='turret'||st.off) continue;
    var lvB=1+0.3*(st.level-1);
    var target=null, bd=1e9;
    for(var j=0;j<G.enemies.length;j++){
      var e=G.enemies[j], d=Math.abs(e.x-st.x);
      if(d<bd){ bd=d; target=e; }
    }
    if(target && bd<76*lvB*(hasNpc('ni')?1.3:1)*camBoost(st)){
      st.angle=Math.atan2(0, target.x-st.x);
      st.atkCd-=dt;
      if(st.atkCd<=0){
        st.atkCd=0.8-(st.level-1)*0.1;
        var dir=target.x>st.x?1:-1;
        G.projs.push({x:st.x, y:GY-26, vx:dir*300, dmg:6*lvB, life:1.0, from:'t'});
      }
    }
  }
}

// 地刺 / 电击门：贴上去持续掉血（之前只有美术、没有伤害）
function updateTraps(dt){
  for(var i=0;i<slots.length;i++){
    var st=slots[i].st;
    if(!st||st.state!=='ok'||st.off) continue;
    if(st.kind!=='spike'&&st.kind!=='zapdoor') continue;
    var r=st.kind==='spike'?11:19;
    var dps=(st.kind==='spike'?5:9)*(1+0.5*(st.level-1));
    st.atkCd=(st.atkCd||0)-dt;
    var hitAny=false;
    for(var j=0;j<G.enemies.length;j++){
      var e=G.enemies[j];
      if(Math.abs(e.x-st.x)>r) continue;
      e.hp-=dps*dt;
      hitAny=true;
      if(!e._trapFx||G.tick-e._trapFx>0.45){
        e._trapFx=G.tick;
        addParts(e.x+rr(-3,3),GY-6,2,st.kind==='spike'?'#ff8f5a':'#7bfff0');
      }
    }
    if(hitAny&&st.atkCd<=0){
      st.atkCd=st.kind==='spike'?0.5:0.35;
      if(st.kind==='zapdoor') glow(st.x,GY-27,20,'#7bfff0',0.2);
      if(!G._zapSfx||G.tick-G._zapSfx>0.28){ G._zapSfx=G.tick; sfx('hit'); }
    }
  }
}

function updateProjs(dt){
  for(var i=G.projs.length-1;i>=0;i--){
    var pr=G.projs[i];
    var px0=pr.x;
    pr.x+=pr.vx*dt; pr.life-=dt;
    var lo=Math.min(px0,pr.x)-6, hi=Math.max(px0,pr.x)+6;
    var hit=false;
    for(var j=0;j<G.enemies.length;j++){
      var e=G.enemies[j];
      if(e.x>=lo&&e.x<=hi){ e.hp-=pr.dmg; hit=true; addParts(e.x,pr.y,3,'#ffd86b'); addDmgNum(e.x,GY-26,pr.dmg,'#bfe8ff');
        if(!G._hitT||G.tick-G._hitT>0.085){ G._hitT=G.tick; sfx('hit'); }
        break; }
    }
    if(hit||pr.life<=0||Math.abs(pr.x)>620) G.projs.splice(i,1);
  }
}

function updatePhase(dt){
  if(G.phase==='day'){
    G.t-=dt*G.speed;
    if(G.t<=0){
      G.phase='dusk'; G.t=DUSK_LEN; G.speed=1;
      auPhaseBgm();
      onDuskEnter();
    }
  } else if(G.phase==='dusk'){
    G.t-=dt*G.speed;
    if(G.t<=0){ startNight(); }
  } else if(G.phase==='night'){
    G.t-=dt*G.speed;
    if(G.wavesLeft>0){
      G.waveTimer-=dt*G.speed;
      if(G.waveTimer<=0) spawnWave();
    }
    if(G.t<=0) endNight(false);
  }
  syncHUD();
}

function endNight(homeLost){
  G.phase='settle';
  G.plan=null;
  auBgm('off'); sfx(homeLost?'hurt':'win');
  G.enemies.length=0; G.projs.length=0;
  var salary=G.staff*60+G.fighters.length*40;
  var vRate=vaultEffRate(G.vault);
  var interest=Math.floor(vaultInterest(G.vault));
  var pre=0;
  if(!homeLost) pre+=10+2*waveCount();
  if(G.dayRevenue>=G.dayTarget) pre+=8;
  G.settle={salary:salary, interest:interest, rate:vRate, pre:pre, homeLost:!!homeLost, rev:G.dayRevenue, target:G.dayTarget, destroyed:G.nightDestroyed};
  G.purse-=salary; if(G.purse<0) G.purse=0;
  G.vault+=interest;
  prestige(pre);
  if(G.over) return;
  var h='<h3>'+(homeLost?'家被攻破了':'第 '+G.day+' 天 · 结算')+'</h3>';
  h+='<div class="txt">今日营业额 '+G.dayRevenue+' / 目标 '+G.dayTarget+'<br>工资 -'+salary+' · 金库利息 +'+interest+'（'+pctStr(G.settle.rate||0)+'/天）<br>声望 +'+pre+(G.nightDestroyed?' · 被毁建筑 '+G.nightDestroyed:'')+'</div>';
  if(homeLost) h+='<div class="txt" style="color:#ff6b6b">小金库损失 40%，家降 1 级，威望 -40。<br>明天白天延长到 260 秒，好好恢复。</div>';
  h+='<div class="txt" style="color:#5c6b85;font-size:0.92em;margin-top:2px">'+settleLine()+'</div>';
  h+='<div class="foot"><button class="btn" data-act="settleGo">继续</button></div>';
  openPanel(h);
}

function newDay(){
  G.day++;
  G.phase='day';
  G.t=G.longDay?DAY_LEN_LONG:DAY_LEN;
  G.longDay=false;
  G.speed=1;
  G.dayRevenue=0;
  G.dayTarget=200+G.day*80;
  G.rain=(G.day%3===0);
  G.homeHP=Math.min(G.homeMax,G.homeHP+25);
  G.nightDestroyed=0;
  for(var i=0;i<slots.length;i++){
    var st=slots[i].st;
    if(!st) continue;
    if(st.state==='ok'&&isShop(st.kind)&&!SHOPS[st.kind].noIncome&&!SHOPS[st.kind].noStock){ st.stock=st.maxStock; st.restockT=0; }
  }
  if(G.day>=4 && !G.zhou && !G.zhouJoined){ G.zhou={x:-36}; }
  // 贷款计息
  if(G.loan>0){
    G.loan=Math.ceil(G.loan*1.05);
    if(G.loan>4000){ prestige(-2); }
  }
  // 保安每日治疗
  for(var f2=0;f2<G.fighters.length;f2++){
    G.fighters[f2].hp=Math.min(G.fighters[f2].maxHp,G.fighters[f2].hp+Math.floor(G.fighters[f2].maxHp*0.35));
  }
  checkNpcSpawns();
  G.enemies.length=0; G.projs.length=0;
  recomputePower(); syncHUD();
  auPhaseBgm();
  if(curSlot!==null&&curSlot!==undefined){
    if(writeSlot(curSlot)) showToast('天亮 · 已自动保存到存档 '+(curSlot+1),'#7ff0c4');
  }
}

// ============================== 触控（全局命中测试，最稳） ==============================
// 不依赖 DOM 层级 / pointer-events，直接在屏幕坐标上判断按到了哪个按钮
var touchState={left:false,right:false};
function hitTest(cx,cy){
  var ids=['leftBtn','rightBtn','eBtn'];
  for(var i=0;i<ids.length;i++){
    var el=$(ids[i]);
    if(!el) continue;
    var r=el.getBoundingClientRect();
    // 扩大命中区，手指比鼠标粗
    var pad=Math.max(8, r.width*0.18);
    if(cx>=r.left-pad && cx<=r.right+pad && cy>=r.top-pad && cy<=r.bottom+pad) return ids[i];
  }
  return null;
}
function setBtnDown(id,on){
  var el=$(id);
  if(el){ el.classList.toggle('down', !!on); }
}
function pressStart(cx,cy){
  if(menuOpen) return null;
  var hit=hitTest(cx,cy);
  if(!hit) return null;
  if(hit==='leftBtn'){ touchState.left=true; setKey('left',true); setBtnDown('leftBtn',true); }
  else if(hit==='rightBtn'){ touchState.right=true; setKey('right',true); setBtnDown('rightBtn',true); }
  else if(hit==='eBtn'){ setBtnDown('eBtn',true); doInteract(); }
  return hit;
}
function pressEnd(){
  if(touchState.left){ touchState.left=false; setKey('left',false); setBtnDown('leftBtn',false); }
  if(touchState.right){ touchState.right=false; setKey('right',false); setBtnDown('rightBtn',false); }
  setBtnDown('eBtn',false);
}
function installTouch(){
  var shield=$('shield');
  var target=shield||document;
  function onDown(e){
    var t=e.touches?e.touches[0]:e;
    if(!t) return;
    if(menuOpen) return;
    var hit=hitTest(t.clientX,t.clientY);
    if(!hit) return;
    if(e.cancelable) e.preventDefault();
    e.stopPropagation();
    pressStart(t.clientX,t.clientY);
  }
  function onMove(e){
    var t=e.touches?e.touches[0]:e;
    if(!t) return;
    if(touchState.left||touchState.right){
      var hit=hitTest(t.clientX,t.clientY);
      if(!hit||hit==='eBtn') pressEnd();
    }
    if(e.cancelable && (touchState.left||touchState.right)) e.preventDefault();
  }
  function onUp(e){
    if(e.cancelable) e.preventDefault();
    pressEnd();
  }
  target.addEventListener('pointerdown',onDown,{passive:false});
  target.addEventListener('pointermove',onMove,{passive:false});
  target.addEventListener('pointerup',onUp,{passive:false});
  target.addEventListener('pointercancel',onUp,{passive:false});
  target.addEventListener('pointerleave',onUp,{passive:false});
  // 触屏兜底
  target.addEventListener('touchstart',onDown,{passive:false});
  target.addEventListener('touchmove',onMove,{passive:false});
  target.addEventListener('touchend',onUp,{passive:false});
  target.addEventListener('touchcancel',onUp,{passive:false});
  // 鼠标兜底（桌面）
  target.addEventListener('mousedown',function(e){
    if(menuOpen) return;
    if(pressStart(e.clientX,e.clientY)) e.preventDefault();
  },{passive:false});
  target.addEventListener('mouseup',function(e){ e.preventDefault(); pressEnd(); },{passive:false});
}

var tutIndex=0, tutActive=true;

function tutCurrent(){

function updateTutorial(){

  if(tutIndex>=TUT.length){ tutActive=false; }

function tutTargetPos(){
  var s=tutCurrent(); if(!s) return null;
  var tg=s.target();
  if(!tg) return null;
  if(tg.kind==='world') return {x:tg.x, y:tg.y};
  if(tg.kind==='slot'){
    var best=null,bd=1e9;
    for(var i=0;i<slots.length;i++){
      var sl=slots[i];
      if(sl.st) continue;
      var d=Math.abs(sl.x-G.player.x);
      if(d<bd){bd=d;best=sl;}
    }
    return best?{x:best.x,y:GY-24}:null;
  }
  if(tg.kind==='build'){
    for(var j=0;j<slots.length;j++){ if(slots[j].st&&slots[j].st.state==='building') return {x:slots[j].x,y:GY-30}; }
    return null;
  }
  if(tg.kind==='coin'){
    for(var ci=0;ci<slots.length;ci++){
      var cs=slots[ci].st;
      if(cs&&cs.pending) return {x:cs.x,y:GY-26};
    }
    if(G.gcoins.length) return {x:G.gcoins[0].x,y:G.gcoins[0].y-8};
    for(var k=0;k<slots.length;k++){ if(slots[k].st&&isShop(slots[k].st.kind)&&slots[k].st.kind!=='pawn') return {x:slots[k].x,y:GY-46}; }
    return null;
  }
  if(tg.kind==='shop'){
    var best2=null;
    for(var m=0;m<slots.length;m++){
      var ss=slots[m].st;
      if(!ss||ss.state!=='ok'||!isShop(ss.kind)) continue;
      if(!SHOPS[ss.kind].noIncome&&ss.staff<ss.level){ best2=ss; break; }
      if(!best2) best2=ss;
    }
    if(!best2) return null;
    var ar=SHOP_ART[best2.kind];
    return {x:best2.x,y:GY-(ar.h0+(best2.level-1)*7)-34};
  }
  return null;
}
function drawTutArrow(){

  // 上方跳动的箭头
  var ay=sy-r-6-ph*2.5;
  ctx.fillStyle='#ffd86b';
  ctx.fillRect(sx-1,ay-7,3,7);
  ctx.beginPath(); ctx.moveTo(sx-4,ay-1); ctx.lineTo(sx+4,ay-1); ctx.lineTo(sx,ay+5); ctx.closePath(); ctx.fill();
}

    if(G.homeHP<G.homeMax*0.4) return '<span class="step">夜</span> 家快撑不住了！跑回去守住';
    if(G.enemies.length>0) return '<span class="step">夜</span> 敌人在砸店 · 跑过去抢修，别站着看';
    return '<span class="step">夜</span> 守住这 150 秒 · 顶部 <b>2×/4×</b> 也能加速';
  }
  if(G.phase==='dusk') return '<span class="step">黄昏</span> 确认电力分配，点「跳过」立刻入夜';
  if(G.order) return '<span class="step">建造</span> 走到街上<span style="color:#8fd3ff">闪烁的空位</span>，按 E 放置';
  if(building>0) return '<span class="step">建造</span> 施工队在建（约 '+Math.ceil(building?slots.find(function(s){return s.st&&s.st.state==='building';}).st.buildT:0)+' 秒）';
  if(builtShops===0) return '<span class="step">1/4</span> 走到<span style="color:#ffd86b">左边五金店</span>，按 E 打开建造菜单';
  var outOfStock=false;
  slots.forEach(function(s){ if(s.st&&isShop(s.st.kind)&&s.st.kind!=='pawn'&&s.st.state==='ok'&&s.st.stock<=0&&s.st.restockT<=0) outOfStock=true; });
  if(outOfStock) return '<span class="step">补货</span> 有店缺货了（招牌冒红点）· 走过去按 E 补货';
  if(G.fighters.length===0) return '<span class="step">2/4</span> 走到<span style="color:#ffd86b">家</span>，按 E 招募一名保安（夜里要靠他）';
  for(var pi=0;pi<slots.length;pi++){
    var ps=slots[pi].st;
    if(ps&&ps.pending>0&&Math.abs(ps.x-G.player.x)>=34) return '<span class="step">收钱</span> 店里有 <b>'+Math.round(ps.pending)+'</b> · 走近自动收';
  }
  if(G.homeLevel===1&&G.totalRevenue>=LV[1].rev&&G.prestige>=LV[1].pres) return '<span class="step">3/4</span> 可以升级家了 · 回家按 E（电力 +6kW）';
  if(builtShops<2) return '<span class="step">扩张</span> 去五金店再开一家店 · 店越多收入越快';
  if(G.day<=3) return '<span class="step">4/4</span> 撑过今晚 · 威望归零才算输';
  return '<span class="step">目标</span> 累计营业额 '+G.totalRevenue+' · 威望 '+Math.floor(G.prestige)+' · 撑下去';
}

// 世界空间（跟随相机）
function R(x,y,w,h,c){ if(w<=0||h<=0) return; ctx.fillStyle=c; ctx.fillRect(Math.round(x+ox),Math.round(y),Math.round(w),Math.round(h)); }
function A(x,y,w,h,c,a){ if(a<=0||w<=0||h<=0) return; ctx.globalAlpha=a; ctx.fillStyle=c; ctx.fillRect(Math.round(x+ox),Math.round(y),Math.round(w),Math.round(h)); ctx.globalAlpha=1; }
// 屏幕空间（不跟随相机）
function S(x,y,w,h,c){ if(w<=0||h<=0) return; ctx.fillStyle=c; ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h)); }
function SA(x,y,w,h,c,a){ if(a<=0||w<=0||h<=0) return; ctx.globalAlpha=a; ctx.fillStyle=c; ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h)); ctx.globalAlpha=1; }

var _RC={};
function rgba(c,a){
  var k=c+'|'+a;
  if(_RC[k]) return _RC[k];
  var r=parseInt(c.substr(1,2),16), g=parseInt(c.substr(3,2),16), b=parseInt(c.substr(5,2),16);
  return _RC[k]='rgba('+r+','+g+','+b+','+a+')';
}

function mkCanvas(w,h){
  try{
    var c=document.createElement('canvas');
    if(!c||typeof c.getContext!=='function') return null;
    c.width=w; c.height=h;
    var g=c.getContext('2d');
    if(!g) return null;
    g.imageSmoothingEnabled=false;
    return {c:c,g:g};
  }catch(e){ return null; }
}

var _GLOW={};
function glowSpr(col){
  if(_GLOW[col]!==undefined) return _GLOW[col];
  var s=mkCanvas(32,32);
  if(!s){ _GLOW[col]=null; return null; }
  var g=s.g, grd=g.createRadialGradient(16,16,0,16,16,16);
  grd.addColorStop(0,rgba(col,0.95));
  grd.addColorStop(0.3,rgba(col,0.42));
  grd.addColorStop(0.65,rgba(col,0.12));
  grd.addColorStop(1,rgba(col,0));
  g.fillStyle=grd; g.fillRect(0,0,32,32);
  _GLOW[col]=s.c; return s.c;
}
function _blit(s,x,y,r,a){
  if(!s||a<=0) return;
  ctx.globalCompositeOperation='lighter';
  ctx.globalAlpha=a;
  ctx.drawImage(s,Math.round(x-r),Math.round(y-r),Math.round(r*2),Math.round(r*2));
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation='source-over';
}
function glow(x,y,r,col,a){ _blit(glowSpr(col),x+ox,y,r,a); }
function glowS(x,y,r,col,a){ _blit(glowSpr(col),x,y,r,a); }

function wetPool(x,w,col,a){

}

var SKY_N=[[7,6,18],[18,13,42],[48,22,62],[104,38,78]];
var SKY_D=[[104,124,158],[158,178,200],[226,208,190],[250,224,196]];
var _SKYC={};
function skyRow(t,night){
  var key=(Math.round(night*10)*1000)+Math.round(t*130);
  var v=_SKYC[key];
  if(v) return v;
  var arr=[],i;
  for(i=0;i<4;i++){
    arr.push(SKY_N[i][0]+(SKY_D[i][0]-SKY_N[i][0])*(1-night));
    arr.push(SKY_N[i][1]+(SKY_D[i][1]-SKY_N[i][1])*(1-night));
    arr.push(SKY_N[i][2]+(SKY_D[i][2]-SKY_N[i][2])*(1-night));
  }
  var seg=t*3, k=Math.min(2,Math.floor(seg)), f=seg-k;
  var c0=k*3, c1=c0+3;
  v='rgb('+Math.round(arr[c0]+(arr[c1]-arr[c0])*f)+','+
        Math.round(arr[c0+1]+(arr[c1+1]-arr[c0+1])*f)+','+
        Math.round(arr[c0+2]+(arr[c1+2]-arr[c0+2])*f)+')';
  _SKYC[key]=v; return v;
}

function drawSky(){
  var night = G.phase==='night'?1:(G.phase==='dusk'?clamp(1-(G.t/DUSK_LEN),0,1)*0.7:0);
  for(var y=0;y<GY;y++) S(0,y,VW,1,skyRow(y/(GY-1),night));
  // 城市光污染雾
  SA(0,GY-40,VW,40,'#ff3fa4',0.06*(1-night*0.35));
  SA(0,GY-18,VW,18,'#3ee9ff',0.05*(1-night*0.3));
  if(night>0.35){
    var sn=(night-0.35)/0.65;
    for(var i=0;i<50;i++){
      var sx=((i*137+31)%VW), sy=((i*61+11)%(GY-56));
      var tw=Math.sin(G.tick*1.6+i*2.1)*0.5+0.5;
      SA(sx,sy,1,1,'#dceaff',(0.2+0.55*tw)*sn);
      if(i%9===0) SA(sx-1,sy,3,1,'#9ec8ff',0.10*sn);
    }
  }
  var moonX=48+((G.day*37)%(VW-100));
  var sunX=40+((G.day*53)%(VW-80));
  if(night<0.62){
    var sa=clamp(1-night*1.6,0,1);
    glowS(sunX,34,30,'#ff9a4a',0.5*sa);
    // 雾里的太阳：上暗下亮的圆
    var rr0=11;
    for(var sy2=-rr0;sy2<=rr0;sy2++){
      var hw=Math.round(Math.sqrt(Math.max(0,rr0*rr0-sy2*sy2)));
      var tone=sy2<-4?'#ffcf7a':(sy2<2?'#ffb765':'#ff8f52');
      SA(sunX-hw,34+sy2,hw*2,1,tone,sa*0.92);
    }
    SA(sunX-16,40,32,4,'#ff8f52',0.12*sa);
    // 日冕（三层同心柔光）
    for(var cr2=0;cr2<3;cr2++){
      var rr3=13+cr2*4;
      for(var cy3=-rr3;cy3<=rr3;cy3+=2){
        var hw3=Math.round(Math.sqrt(Math.max(0,rr3*rr3-cy3*cy3)));
        SA(sunX-hw3,34+cy3,hw3*2,1,'#ffb06a',(0.05-cr2*0.012)*sa);
      }
    }
  }
  if(night>0.1){
    var mn=clamp(night*1.25,0,1);
    glowS(moonX,30,26,'#8fb8ff',0.28*mn);
    var mr=7;
    for(var my=-mr;my<=mr;my++){
      var mw=Math.round(Math.sqrt(Math.max(0,mr*mr-my*my)));
      SA(moonX-mw,30+my,mw*2,1,'#e6eeff',mn*0.95);
    }
    SA(moonX-3,27,3,2,'#b9cdf0',mn*0.55);
    SA(moonX+1,31,2,2,'#b9cdf0',mn*0.45);
    SA(moonX-1,33,2,1,'#b9cdf0',mn*0.4);
  }
  var t2=(G.tick*0.05)%1;
  var fx=-24+t2*(VW+48);
  SA(fx,20,6,1,'#3ee9ff',0.45*night);
  glowS(fx+5,20,6,'#3ee9ff',0.4*night);

  // ---- 云带：三层软边横条，缓慢漂移 ----
  var cl=[
    {y:22,w:86,v:2.4,o:0,a:0.085,c:'#a8c6ee'},
    {y:38,w:124,v:1.5,o:120,a:0.070,c:'#c2d6f0'},
    {y:54,w:70,v:2.0,o:240,a:0.060,c:'#9ab8de'}
  ];
  for(var ci2=0;ci2<cl.length;ci2++){
    var cc=cl[ci2];
    var cx4=((G.tick*cc.v+cc.o)%(VW+cc.w*2))-cc.w;
    var fade=0.7+0.3*Math.sin(G.tick*0.3+ci2);
    for(var cr=0;cr<4;cr++){
      var inw=cc.w-cr*Math.round(cc.w*0.20);
      SA(cx4+cr*Math.round(cc.w*0.10),cc.y+cr,inw,1,cc.c,cc.a*(1-cr*0.22)*fade*(1-night*0.5));
    }
  }
  // ---- 空中广告飞艇（白天/黄昏缓慢掠过） ----
  if(night<0.45){
    var bp=((G.tick*3.6)%(VW+240))-120;

var skyline=[];
var NEONS=['#ff3fa4','#3ee9ff','#9a6bff','#ffc857','#3dffa8'];
function makeSkyline(){
  skyline=[];
  var seed=77123;
  function rnd(){ seed=(seed*1103515245+12345)&0x7fffffff; return seed/0x7fffffff; }
  for(var i=0;i<54;i++){
    var w=14+Math.floor(rnd()*18);
    var h=34+Math.floor(rnd()*84);
    var r=rnd();
    skyline.push({
      x:i*16-30, w:w, h:h,
      tone: r<0.4?'#0b1020':(r<0.75?'#0d1426':'#090e1a'),
      neon: rnd()>0.44?NEONS[Math.floor(rnd()*5)]:null,
      neonH: 3+Math.floor(rnd()*10),
      neonSide: rnd()>0.42,
      ant: rnd()>0.62,
      tank: rnd()>0.86,
      sp: rnd()>0.78,
      sd: Math.floor(rnd()*997)
    });
  }
}
makeSkyline();

function drawSkyline(par,baseY,scale,night,dim){
  var W=54*16;
  var off=-(G.camX*par)%W;
  if(off>0) off-=W;
  for(var pass=0;pass<2;pass++){
    var base=off+pass*W;
    for(var i=0;i<skyline.length;i++){
      var b=skyline[i];
      var x=b.x+base;
      if(x<-40||x>VW+40) continue;
      var hh=Math.round(b.h*scale);
      var top=Math.round(baseY-hh);
      S(x,top,b.w,hh,dim?b.tone:'#0d1426');
      // 顶部边缘光（模拟天空补光）
      S(x,top,b.w,1,rgba('#6f8cb8',dim?0.42:0.62));
      SA(x+1,top+1,b.w-2,1,rgba('#4d6288',dim?0.16:0.28));
      // 右侧体积阴影 + 底部压暗
      SA(x+b.w-2,top,2,hh,'#000',0.30);
      SA(x,top+hh-3,b.w,3,'#000',0.18);
      // 楼身两侧竖向明暗（受光在左）
      SA(x,top+1,1,hh-2,rgba('#8fa8ce',dim?0.05:0.09));
      var lit=0.14+0.8*night;
      for(var wy=4;wy<hh-4;wy+=5){
        for(var wx=2;wx<b.w-2;wx+=4){
          var s=(wx*7+wy*13+b.sd)%11;
          if(s<3) SA(x+wx,top+wy,2,2,s===1?'#ffc857':'#8fd3ff',(0.08+0.24*lit)*(s===0?1.15:0.7));
        }
      }
      if(b.neon&&!dim){
        var fl=Math.sin(G.tick*2.2+i*1.7)>-0.86?1:0.2;
        if(b.neonSide){
          SA(x+1,top+5,1,b.neonH,b.neon,0.75*fl);
          glowS(x+1,top+5+b.neonH/2,9,b.neon,0.24*fl);
        } else {
          SA(x+2,top+2,b.w-4,1,b.neon,0.7*fl);
          glowS(x+b.w/2,top+3,11,b.neon,0.2*fl);
        }
      }
      if(b.tank){ S(x+2,top-4,5,4,'#101828'); S(x+3,top-5,3,1,'#1a2436'); }
      if(b.sp){
        S(x+b.w/2-1,top-7,3,7,'#0f1725');
        if(Math.sin(G.tick*2+i)>0.4) SA(x+b.w/2-2,top-9,5,3,'#ff5a4a',0.25);
      }
      if(b.ant){
        S(x+b.w-4,top-10,1,10,'#141d2e');
        if(Math.sin(G.tick*3+i)>0.55) SA(x+b.w-4,top-11,1,1,'#ff5a4a',0.9);
      }
    }
  }
  var grd=ctx.createLinearGradient(0,baseY-34,0,baseY+6);
  grd.addColorStop(0,'rgba(0,0,0,0)');
  grd.addColorStop(1,rgba('#ff3fa4',0.11*(1-night*0.5)));
  ctx.fillStyle=grd;
  ctx.fillRect(0,baseY-34,VW,40);
}

  // 屋顶女儿墙

  A(x-w/2-1,top,2,1,'#0a1120',1);
  // 招牌
  R(x-w/2+1,top+4,w-2,14,'#070b12');
  R(x-w/2+1,top+4,w-2,1,rgba(nc,0.9));

  // 雨棚
  var awnC=st.kind==='conv'?'#123241':(st.kind==='tea'?'#35102b':(st.kind==='food'?'#35220e':(st.kind==='hotel'?'#241a3a':(st.kind==='cyber'?'#141a3a':(st.kind==='med'?'#0e2a24':'#20183a')))));

  // ---------- 店面玻璃 ----------

  A(x-w/2+4,gy0+2,2,gh-4,'#ffffff',0.06);
  A(x+w/2-6,gy0+2,1,gh-4,'#ffffff',0.04);
  // 门
  var dx = st.kind==='pawn'? x-6 : x+6;

    var bob=Math.round(Math.sin(G.tick*4)*1.2);
    var pulse=0.6+0.4*Math.sin(G.tick*5);
    var ey=GY-h-30+bob;
    R(x-6,ey,12,14,'#2a0a10');
    R(x-5,ey+1,10,12,'#ff3a3a');
    R(x-5,ey+1,10,1,'#ff8a8a');
    text3(x-1,ey+3,'!','#ffffff');
    R(x-1,ey+9,3,2,'#ffffff');
    glow(x,ey+7,14,'#ff3a3a',0.22*pulse+0.12);
  }
  // 补货进度
  if(st.restockT>0){
    var rw=w-8, rp=1-st.restockT/SHOPS[st.kind].restock;
    R(x-rw/2-1,GY-3,rw+2,4,'#080c14');
    R(x-rw/2,GY-2,rw,2,'#18202f');
    R(x-rw/2,GY-2,rw*clamp(rp,0,1),2,'#7ff0c4');
    A(x-rw/2,GY-2,rw*clamp(rp,0,1),1,'#c8ffe8',0.6);
  }
  // 店内待收金额
  if(st.pending>1&&!off){
    var pn=Math.round(st.pending), pt=''+pn, pw2=text3W(pt);
    var py=GY-h-18+Math.round(Math.sin(G.tick*3+st.x)*1.5);
    A(x-pw2/2-7,py-2,pw2+14,10,'#0a0f18',0.78);
    R(x-pw2/2-7,py-2,pw2+14,1,'#ffc857');
    R(x-pw2/2-6,py+1,4,4,'#c9a24a');
    R(x-pw2/2-5,py+2,2,2,'#ffd86b');
    text3(x-pw2/2+1,py,pt,'#ffd86b');
    glow(x,py+2,12,'#ffc857',0.12);
  }
  // 断电
  if(off){
    R(x+11,top+26,7,7,'#140810');
    R(x+12,top+27,5,5,'#ff6b6b');
    glow(x+14,top+29,9,'#ff6b6b',0.2);
  }
  hpBar(st,x,top-4,w-6);
}

function drawDef(st){
  var x=st.x,y=GY;
  var night=(G.phase==='night');
  if(st.kind==='barricade'){
    shadowAt(x,34,0.35);
    for(var i=0;i<2;i++){
      var bx=x-17+i*18;
      R(bx,y-18,15,18,'#2f394b');
      R(bx,y-18,15,1,'#485a72');
      R(bx,y-18,1,18,'#41506a');
      R(bx,y-7,15,1,'#212938');
      for(var s=0;s<4;s++) R(bx+1+s*4,y-15,2,5,i%2?'#ffc857':'#161b26');
      R(bx+2,y-18,2,3,'#5b6a86');
    }
    R(x-18,y-20,36,2,'#28344c');
    R(x-18,y-20,36,1,'#5b6a86');
    var on=Math.sin(G.tick*4)>0;
    R(x-2,y-23,4,3,on?'#ff5a4a':'#38141a');
    if(on) glow(x,y-22,10,'#ff5a4a',0.26);

  } else if(st.kind==='spike'){
    shadowAt(x,34,0.3);
    R(x-17,y-3,34,3,'#1e2739');
    R(x-17,y-3,34,1,'#38496a');
    for(var s2=0;s2<5;s2++){
      var sx=x-15+s2*7;

      R(sx+1,y-10,1,3,'#c8d2df');

    }
    hpBar(st,x,y-15,34);
  } else if(st.kind==='camera'){
    shadowAt(x,16,0.3);
    // 立杆
    R(x-1,y-38,2,38,'#28344c');
    R(x-1,y-38,1,38,'#3d5474');
    R(x-6,y-40,12,2,'#33415c');
    // 云台 + 支臂
    var sw3=Math.sin(G.tick*0.7+x)*3;
    R(x-1,y-44,2,4,'#44587a');
    R(x-10+sw3,y-46,9,3,'#38496a');
    R(x-10+sw3,y-46,9,1,'#6b86ab');
    // 机身
    R(x-11+sw3,y-44,11,7,'#4b5f80');
    R(x-11+sw3,y-44,11,1,'#7089ad');
    R(x-11+sw3,y-38,11,1,'#26324a');
    // 镜头
    R(x-9+sw3,y-42,4,4,'#080d16');
    R(x-8+sw3,y-41,2,2,'#ff5a4a');
    R(x-2+sw3,y-42,1,1,'#3dffa8');
    if(night){
      glow(x-2+sw3,y-42,9,'#ff5a4a',0.22);
      // 扫描光锥
      ctx.globalCompositeOperation='lighter';
      var g2=ctx.createLinearGradient(0,y-42,0,y-14);
      g2.addColorStop(0,'rgba(255,90,90,0.13)');
      g2.addColorStop(1,'rgba(255,90,90,0)');
      ctx.fillStyle=g2;
      ctx.beginPath();
      ctx.moveTo(x-4+sw3+ox,y-42);
      ctx.lineTo(x-1+sw3+ox,y-42);
      ctx.lineTo(x+16+sw3+ox,y-12);
      ctx.lineTo(x-20+sw3+ox,y-12);
      ctx.closePath(); ctx.fill();
      ctx.globalCompositeOperation='source-over';
    }
    if(st.off){ R(x+3,y-34,6,5,'#140810'); R(x+4,y-33,4,3,'#ff6b6b'); }
    hpBar(st,x,y-50,24);
  } else if(st.kind==='zapdoor'){
    shadowAt(x,30,0.35);
    // 双柱
    for(var p3=0;p3<2;p3++){
      var px6=x-16+p3*26;
      R(px6,y-34,6,34,'#2a3550');
      R(px6,y-34,6,1,'#44587a');
      R(px6,y-34,1,34,'#3d5474');
      R(px6,y-30,6,1,'#ffc857');
      R(px6,y-22,6,1,'#ffc857');
      R(px6-1,y-36,8,2,'#38496a');
    }
    // 电弧
    if(!st.off){
      var arc=Math.sin(G.tick*22+st.x)>-0.2;
      if(arc){
        ctx.strokeStyle='#7bfff0';
        ctx.lineWidth=1;
        ctx.beginPath();
        for(var ax=0;ax<7;ax++){
          var px7=x-10+ax*3.4;
          var py7=y-30+Math.sin(G.tick*30+ax*2)*4+(ax%2?2:-2);
          if(ax===0) ctx.moveTo(px7+ox,py7); else ctx.lineTo(px7+ox,py7);
        }
        ctx.stroke();
        glow(x,y-28,18,'#7bfff0',0.22);
      }
      A(x-10,y-32,20,3,'#7bfff0',0.12);
      A(x-10,y-24,20,3,'#7bfff0',0.12);
    }
    if(st.off){ R(x-3,y-20,7,6,'#140810'); R(x-2,y-19,5,4,'#ff6b6b'); }
    hpBar(st,x,y-38,32);
  } else if(st.kind==='turret'){
    shadowAt(x,26,0.4);
    R(x-11,y-9,22,9,'#28344c');
    R(x-11,y-9,22,1,'#41506a');
    R(x-8,y-4,16,2,'#161e2c');
    R(x-3,y-16,6,9,'#33415c');
    R(x-8,y-26,16,11,'#38496a');
    R(x-8,y-26,16,1,'#5b6a86');
    R(x-6,y-23,12,2,'#8fd3ff');
    var ang=st.angle||-Math.PI/2;
    var bx2=Math.cos(ang), by2=Math.sin(ang);
    for(var t2=0;t2<10;t2++){
      R(x+bx2*t2-1.5, y-21+by2*t2*0.55-1.5, 3,3, t2>6?'#5b6a86':'#2c3a55');
    }
    var blink=Math.sin(G.tick*5+st.x)>0.2;
    R(x-2,y-22,3,2,blink?'#ff5a4a':'#48191d');
    if(blink&&!st.off) glow(x-0.5,y-21,8,'#ff5a4a',0.26);
    if(st.off){
      R(x-9,y-28,7,5,'#140810');
      R(x-8,y-27,5,3,'#ff6b6b');
    }
    R(x+8,y-7,1,7,'#16465e');
    hpBar(st,x,y-32,32);
  }
}

function drawSite(st){
  var x=st.x,y=GY;
  R(x-16,y-1,32,1,'#28344c');
  for(var i=0;i<3;i++) R(x-13+i*13,y-30,1,30,'#28344c');
  for(var h2=0;h2<3;h2++) R(x-14,y-28+h2*9,29,1,'#28344c');
